<style>
  :root {
    --navy: #16294B; --navy2: #1F3A63; --gold: #C79A3D;
    --paper: #F7F5F0; --ink: #1B1B18; --muted: #8A8271; --muted2: #7A7466;
    --border: #E4DFD3; --card: #FFFFFF; --divider: #EFEAE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ECE8DE; }
  body { font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--ink); }
  a { color: var(--navy); }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  .shell { max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--paper); display: flex; flex-direction: column; }
  @media (min-width: 461px) {
    body { padding: 24px 0; }
    .shell { min-height: min(844px, 92dvh); border-radius: 20px; overflow: hidden; box-shadow: 0 12px 40px rgba(22,41,75,.16); border: 1px solid #DFD9C8; }

  .scroll { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
  .hidden { display: none !important; }

  .header { flex: 0 0 auto; background: var(--navy); border-bottom: 2px solid var(--gold); }
  .header-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; min-height: 44px; }
  .header-btn { width: 32px; height: 32px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 8px; color: var(--paper); }
  .mark { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 8px; background: var(--navy2); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; }
  .header-title { font-size: 15px; font-weight: 700; color: var(--paper); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub { font-size: 11.5px; font-weight: 500; color: #B9C3D6; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .offline-banner { padding: 7px 16px; background: #3A2E12; display: flex; align-items: center; gap: 8px; }
  .offline-dot { width: 7px; height: 7px; border-radius: 50%; background: #E3A83B; flex: 0 0 auto; }
  .offline-text { font-size: 11px; color: #F0D9A6; line-height: 1.3; }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .pin-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .pin-tag { display: flex; align-items: center; gap: 6px; }
  .pin-label { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #B07F1E; text-transform: uppercase; }
  .post-time { font-size: 11px; color: #9B9484; }
  .post-author { font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 5px; }
  .post-text { font-size: 13.5px; line-height: 1.5; color: #2B2A25; white-space: pre-line; }
  .link-btn { margin-top: 8px; background: none; border: none; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--navy); display: flex; align-items: center; gap: 4px; }
  .icon-btn { background: #F7F0E8; border: none; border-radius: 7px; width: 30px; height: 30px; flex: 0 0 auto; color: var(--navy); display: flex; align-items: center; justify-content: center; }
  .icon-btn:disabled { opacity: .35; }
  .historico-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }
  .historico-item { font-size: 12px; color: #4A473E; }
  .historico-meta { font-size: 11px; color: #9B9484; margin-top: 2px; }
  .steps { margin-top: 10px; border-top: 1px solid var(--divider); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; gap: 8px; align-items: baseline; }
  .step-date { font-size: 11.5px; font-weight: 700; color: var(--gold); flex: 0 0 auto; width: 66px; }
  .step-text { font-size: 12.5px; color: #4A473E; line-height: 1.4; }

  .group-card { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }

  .group-name { font-size: 14px; font-weight: 700; color: var(--navy); }
  .group-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group-card-folder { background: #F2ECE0; }
  .group-subgroup { padding-left: 16px; border-left: 2px solid var(--border); margin: -4px 0 10px 20px; }
  .group-card-sub { padding: 10px 13px; margin-bottom: 8px; }
  .group-card-sub .group-icon { width: 32px; height: 32px; }
  .group-meta { text-align: right; flex: 0 0 auto; }
  .group-count { font-size: 11.5px; font-weight: 600; color: #4A473E; }
  .unread-dot { margin-top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: auto; }
  .hint { margin-top: 6px; font-size: 11.5px; color: #9B9484; line-height: 1.5; padding: 0 2px; }

  .members-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .member-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .member-name { font-size: 12.5px; font-weight: 600; color: #2B2A25; }
  .member-role { font-size: 11px; color: #9B9484; }
  .remove-btn { background: #F7F0E8; border: none; border-radius: 7px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: #A24B3E; flex: 0 0 auto; }
  .remove-btn:disabled { opacity: .4; cursor: not-allowed; }

  .search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; margin-bottom: 14px; }
  .search-box input { border: none; outline: none; background: transparent; font-size: 13px; flex: 1 1 auto; color: #2B2A25; width: 100%; }
  .faq-cat-icon { width: 38px; height: 38px; border-radius: 9px; background: #F1ECE0; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--navy); }
  .faq-cat-name { font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .faq-cat-count { font-size: 11.5px; color: #9B9484; }
  .faq-q-btn { width: 100%; text-align: left; background: none; border: none; padding: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .faq-q { font-size: 13.5px; font-weight: 600; color: var(--navy); line-height: 1.4; }
  .faq-a { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--divider); font-size: 13px; line-height: 1.55; color: #4A473E; }
  .faq-cat-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }

  .profile-hero { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; text-align: center; }
  .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: var(--paper); font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .profile-name { font-size: 16px; font-weight: 700; color: var(--navy); }
  .profile-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .profile-badge { display: inline-block; margin-top: 10px; padding: 4px 10px; background: #F1ECE0; border-radius: 20px; font-size: 11.5px; font-weight: 600; color: var(--navy); }
  .audience-badge { display: inline-block; margin-top: 10px; padding: 4px 12px; background: var(--navy); border: 1px solid var(--navy); border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #F7F5F0; }
  .info-list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px 14px; margin-bottom: 14px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--divider); }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 12.5px; color: var(--muted); }
  .info-value { font-size: 12.5px; font-weight: 600; color: #2B2A25; }
  .toggle-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-title { font-size: 13px; font-weight: 600; color: #2B2A25; }
  .toggle-desc { font-size: 11.5px; color: #9B9484; margin-top: 2px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; border: none; position: relative; flex: 0 0 auto; }
  .switch-knob { width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 3px; transition: left .15s; }
  .cta-btn { width: 100%; margin-top: 12px; background: var(--navy); color: var(--paper); border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }

  .filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .filter-chip { flex: 0 0 auto; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: #fff; color: #4A473E; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .filter-chip.active { border-color: var(--navy); background: var(--navy); color: var(--paper); }
  .painel-member { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .add-form { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 6px; margin-bottom: 12px; }
  .add-form-title { font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .add-form input, .add-form select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; margin-bottom: 8px; outline: none; background: #fff; }
  .add-form-actions { display: flex; gap: 8px; }
  .btn-primary { flex: 1 1 auto; background: var(--navy); color: #fff; border: none; border-radius: 7px; padding: 10px; font-size: 13px; font-weight: 600; }
  .btn-secondary { flex: 0 0 auto; background: #F1ECE0; color: #4A473E; border: none; border-radius: 7px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
  .add-dashed { width: 100%; border: 1.5px dashed #C6BFAE; background: transparent; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 20px; }

  .zone-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--divider); }
  .zone-name { font-size: 12.5px; color: #2B2A25; }
  .zone-count { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .offline-note { background: #FBF3E4; border: 1px solid #E9CE93; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.5; color: #7A5A17; }

  .composer { flex: 0 0 auto; border-top: 1px solid var(--border); background: #fff; padding: 10px 14px; }
  .composer-row { display: flex; gap: 8px; align-items: center; }
  .composer-row input { flex: 1 1 auto; padding: 10px 13px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; outline: none; }
  .send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--navy); border: none; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .composer-blocked { font-size: 11.5px; color: #9B9484; text-align: center; padding: 6px 0; }

  .bottomnav { flex: 0 0 auto; border-top: 1px solid var(--border); background: #fff; display: flex; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); position: sticky; bottom: 0; }
  .nav-btn { flex: 1 1 0; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted2); }
  .nav-btn.active { color: var(--navy); }
  .nav-label { font-size: 10.5px; font-weight: 500; }
  .nav-btn.active .nav-label { font-weight: 700; }

  .message-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 10px; }
  .message-card.grouped { margin-top: -6px; padding-top: 7px; }
  .message-card.message-informe { background: #FBF5E8; border: 1px solid #E4CA8B; }
  .grouped-row { min-height: 12px; margin-bottom: 4px; }

  .mural-fanout { background: #FBF8F1; border: 1px solid #E9DFC4; border-radius: 10px; padding: 11px 12px; margin-bottom: 16px; }
  .mural-fanout-title { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: #9B7A2E; margin-bottom: 7px; letter-spacing: .01em; }
  .mural-fanout-item { width: 100%; text-align: left; background: #fff; border: 1px solid #EFE4C9; border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mural-fanout-item:last-child { margin-bottom: 0; }
  .mural-fanout-text { font-size: 12px; color: #4A473E; line-height: 1.4; }

  .center-screen { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
  .login-mark { width: 56px; height: 56px; border-radius: 14px; background: var(--navy2); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .login-title { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .login-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 22px; max-width: 300px; }
  .login-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .login-form input { padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; outline: none; }
  .login-btn { background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 13.5px; font-weight: 600; }
  .login-btn:disabled { opacity: .5; }
  .consent-row { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; line-height: 1.4; color: var(--muted); text-align: left; }
  .consent-row input { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; }
  .login-msg { font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .login-msg.error { color: #A24B3E; }
  .login-msg.ok { color: #3E6E4E; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .review-box { background: #FBF8F1; border: 1px solid #E9DFC4; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .review-title { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: #9B7A2E; text-transform: uppercase; margin-bottom: 10px; }
  .review-item { background: #fff; border: 1px solid #EFE4C9; border-radius: 8px; padding: 11px; margin-bottom: 8px; }
  .review-actions { display: flex; gap: 8px; margin-top: 9px; }
  .btn-approve { flex: 1 1 auto; background: #3E6E4E; color: #fff; border: none; border-radius: 7px; padding: 8px; font-size: 12.5px; font-weight: 600; }
  .btn-reject { flex: 1 1 auto; background: #F7F0E8; color: #A24B3E; border: none; border-radius: 7px; padding: 8px; font-size: 12.5px; font-weight: 600; }
  .del-msg-btn { background: none; border: none; color: #B0A98F; padding: 0; margin-left: 8px; }
  .msg-removed { font-size: 12.5px; color: #9B9484; font-style: italic; }
  .banner-error { background: #FBEAE6; border: 1px solid #E9B4A6; color: #8A3D2E; border-radius: 8px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }
</style>

<script>
"use strict";

// ====== CONFIG — trocar aqui quando o projeto Supabase for pra nuvem ======
var SUPABASE_URL = 'https://zetednplnwdhatpmcimo.supabase.co';

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var FAQ_DATA = {
  urna: { name: 'Urna Eletrônica', items: [
    { q: 'A urna travou, o que eu faço?', a: 'O presidente de mesa deve fazer a única contingência permitida: ligar e desligar a urna eletrônica. Se não resolver, o administrador de prédio deve contatar imediatamente o Cartório Eleitoral.' },
    { q: 'Até que horas o presidente deve emitir a Zerésima?', a: 'Até, no máximo, 7h30. O resumo da zerésima deve ficar afixado na entrada da seção.' },
    { q: 'Preciso afixar algo na entrada da seção?', a: 'Sim: o resumo da zerésima e, ao final, a via do Boletim de Urna.' },
    { q: 'Como a urna deve ficar posicionada na seção?', a: 'Na cabine de votação, posicionada de forma a garantir o sigilo do voto — só a eleitora ou o eleitor pode ver o visor, com livre movimentação na seção. É vedado afixar lista com nome ou número de inscrição eleitoral nas dependências da seção ou do local de votação (Resolução TSE 23.751/2026, art. 19, e Código Eleitoral, art. 138).' }
  ]},
  encerramento: { name: 'Encerramento da Seção', items: [
    { q: 'O que preciso entregar pra Junta Eleitoral ao final da votação?', a: 'Assim que os trabalhos da seção forem encerrados, o administrador de prédio deve se apresentar à Junta da 4ª Zona Eleitoral com o envelope contendo: a Zerésima, 2 Boletins de Urna (BU), o Boletim de Eleitores Habilitados pela Biometria (BEHB), o Boletim de Identificação de Mesários e a ata de cada seção. A Junta confere os documentos e libera o administrador.' },
    { q: 'Preciso checar alguma coisa antes de fechar o local de votação?', a: 'Sim. Antes de encerrar, verifique se há eleitores em banheiros ou corredores que ainda não votaram — oriente-os a ir imediatamente para a fila da seção deles. Todos que entrarem até as 17h têm direito de votar.' }
  ]},
  justificativa: { name: 'Justificativa Eleitoral', items: [
    { q: 'O eleitor não vai votar, o que ele precisa?', a: 'Preencher o Requerimento de Justificativa Eleitoral (RJE) com o e-título instalado e atualizado, uma certidão de quitação eleitoral ou, pelo menos, o número do título — a urna só reconhece números.' },
    { q: 'Quem coordena a fila de quem vai justificar?', a: 'O secretário da mesa receptora, que deve saber previamente sobre a necessidade do RJE e o número de inscrição eleitoral.' }
  ]},
  financeiro: { name: 'Financeiro (PIX)', items: [
    { q: 'Quem recebe o PIX do auxílio-alimentação?', a: 'O responsável financeiro — pelo menos 2 por local com várias seções — chave PIX obrigatoriamente CPF, via Banco do Brasil. Cada mesário assina o formulário imediatamente ao receber.' },
    { q: 'Um mesário faltou, o que fazer com o valor dele?', a: 'O valor deve ser recolhido para o PIX da chefia da 4ª Zona Eleitoral. No formulário, o campo de assinatura do faltante fica em branco.' },
    { q: 'Houve substituição de mesário no dia, e agora?', a: 'A situação deve constar em ata. Um formulário específico permite escrever o nome do substituto, que assina normalmente.' }
  ]},
  midia: { name: 'Mídia de Resultado', items: [
    { q: 'Quantos Pontos de Transmissão Secundários (PTS) existem este ano?', a: 'A 4ª ZE solicitou 6 PTS este ano — na última eleição foram 3.' },
    { q: 'O que o responsável pela mídia de resultado faz?', a: 'Segue para o PTS indicado no seu roteiro e entrega a mídia ao responsável, que fará a leitura no Sistema Transportador.' }
  ]},
  fiscalizacao: { name: 'Fiscalização', items: [
    { q: 'Quantos fiscais por partido são permitidos por seção?', a: 'Até 2 por partido, coligação ou federação, atuando um de cada vez. Candidatas e candidatos têm atuação garantida por direito próprio (fiscal nato).' },
    { q: 'O que um fiscal pode fazer?', a: 'Fiscalizar todas as fases da votação e impugnar ou protestar, verbalmente ou por escrito, sobre a identidade do eleitor ou o andamento da votação.' }

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ---------- máscaras dos campos de identidade (login) ----------
// Só letras (com acento) e espaço — nunca número/símbolo, nome não tem isso.
function maskNome(v) { return (v || '').replace(/[^A-Za-zÀ-ÖØ-öø-ÿ ]/g, ''); }
// CPF: só dígito, formata 000.000.000-00
function maskCPF(v) {
  var d = (v || '').replace(/\D/g, '').slice(0, 11);
  var out = d;
  if (d.length > 9) out = d.slice(0, 3) + '.' + d.slice(3, 6) + '.' + d.slice(6, 9) + '-' + d.slice(9);
  else if (d.length > 6) out = d.slice(0, 3) + '.' + d.slice(3, 6) + '.' + d.slice(6);
  else if (d.length > 3) out = d.slice(0, 3) + '.' + d.slice(3);
  return out;
}
// Título de eleitor: só dígito, formata em grupos de 4 (0000 0000 0000)
function maskTitulo(v) {
  var d = (v || '').replace(/\D/g, '').slice(0, 12);
  return (d.match(/.{1,4}/g) || []).join(' ');
}
// Data de nascimento: só dígito, formata dd/mm/aaaa
function maskData(v) {
  var d = (v || '').replace(/\D/g, '').slice(0, 8);
  var out = d;
  if (d.length > 4) out = d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
  else if (d.length > 2) out = d.slice(0, 2) + '/' + d.slice(2);
  return out;
}

// ================= AUTH / BOOT =================
async function boot() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('erro') === '1') state.banner = 'Não foi possível concluir o acesso. Peça um novo link.';

  // Supabase devolve erro de link (expirado, já usado, inválido) no #hash da URL.
  var hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  if (hashParams.get('error')) {
    var codigoErro = hashParams.get('error_code') || '';
    state.banner = codigoErro === 'otp_expired'
      ? 'Esse link expirou ou já foi usado. Peça um novo — cada link vale por poucos minutos e só funciona uma vez.'
      : 'Não foi possível concluir o acesso por esse link. Peça um novo.';
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  var { data } = await sb.auth.getSession();
  if (data.session) { await onSignedIn(data.session); } else { state.screen = 'login'; render(); }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'SIGNED_IN' && session && (!state.session || state.session.user.id !== session.user.id)) onSignedIn(session);
    else if (event === 'SIGNED_OUT') { state.session = null; state.perfil = null; state.screen = 'login'; render(); }
  });
}

async function onSignedIn(session) {
  state.session = session;
  var { data: perfil, error } = await sb.from('perfis').select('id, nome_completo, nome_exibicao, funcao, is_moderador, is_revisor, ativo, criado_em, consentimento_em').eq('id', session.user.id).single();
  if (error || !perfil) {
    state.banner = 'Sua conta ainda não está liberada neste app. Fale com o Cartório Eleitoral.';
    await sb.auth.signOut();
    return;
  }
  state.perfil = perfil;
  state.perfilFormNomeExibicao = perfil.nome_exibicao || '';
  state.screen = 'mural';
  await Promise.all([loadMural(), loadMyGroups()]);
  render();
}

async function solicitarCodigo() {
  var cpf = state.loginCpf.trim(), titulo = state.loginTitulo.trim(), nome = state.loginNome.trim(), nascimento = state.loginNascimento.trim();
  if (!cpf || !titulo || !nome || !nascimento) { state.loginStatus = 'error:Preencha CPF, título, nome completo e data de nascimento.'; render(); return; }
  if (!state.loginAceite) { state.loginStatus = 'error:Marque o aceite do uso dos dados pra continuar.'; render(); return; }
  state.loginSending = true; state.loginStatus = ''; render();
  try {
    var resp = await fetch(SUPABASE_URL + '/functions/v1/solicitar-acesso', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cpf: cpf, titulo: titulo, nome: nome, data_nascimento: nascimento, consentimento: true, redirect_to: window.location.origin + window.location.pathname })
    });
    var json = await resp.json();
    state.loginSending = false;
    if (!resp.ok) { state.loginStatus = 'error:Não foi possível verificar seus dados agora. Tente de novo em instantes.'; render(); return; }
    state.loginEmailReal = json.email || '';
    state.loginEmailMascarado = json.email_mascarado || '';
    state.loginStep = 'codigo';
    state.loginStatus = '';
    render();
  } catch (e) {
    state.loginSending = false; state.loginStatus = 'error:Sem conexão com o servidor. Tente novamente.'; render();
  }
}

async function confirmarCodigo() {
  var codigo = state.loginCodigo.trim();
  if (!codigo) return;
  if (!state.loginEmailReal) { state.loginStatus = 'error:Código inválido ou expirado. Volte e confira seus dados.'; render(); return; }
  state.loginSending = true; state.loginStatus = ''; render();
  var { error } = await sb.auth.verifyOtp({ email: state.loginEmailReal, token: codigo, type: 'email' });
  state.loginSending = false;
  if (error) { state.loginStatus = 'error:Código inválido ou expirado. Peça um novo.'; render(); return; }
  // sucesso: onAuthStateChange (SIGNED_IN) cuida da navegação pro app
}

async function verificarSessao() {
  state.loginSending = true; state.loginStatus = ''; render();
  var { data } = await sb.auth.getSession();
  state.loginSending = false;
  if (data.session) return; // onAuthStateChange cuida do resto
  state.loginStatus = 'error:Ainda não. Se já clicou no link, aguarde alguns segundos e tente de novo — ou volte e peça um novo link.';
  render();
}

function voltarParaIdentidade() {
  state.loginStep = 'identidade'; state.loginCodigo = ''; state.loginEmailReal = ''; state.loginEmailMascarado = ''; state.loginStatus = '';
  render();
}

async function logout() { await sb.auth.signOut(); state.loginStep = 'identidade'; state.loginCpf = ''; state.loginTitulo = ''; state.loginNome = ''; state.loginNascimento = ''; state.loginCodigo = ''; }

async function loadMyGroups() {
  if (state.perfil.is_moderador) {
    // moderador (Rita/Fernanda/desenvolvedor) enxerga todos os grupos pra
    // acompanhar tudo, mesmo sem ser membro formal de cada um — condiz com
    // a RLS de mensagens, que já libera leitura irrestrita pra moderador.
    var { data: todos, error: todosErr } = await sb.from('grupos').select('id,slug,nome,descricao,tipo,escola_id').order('nome');
    if (todosErr) { state.banner = todosErr.message; return; }
    state.myGroups = todos || [];
    return;
  }
  var { data, error } = await sb.from('memberships').select('grupo_id, papel, grupos(id,slug,nome,descricao,tipo,escola_id)').eq('perfil_id', state.session.user.id);
  if (error) { state.banner = error.message; return; }
  state.myGroups = (data || []).map(function (row) { return row.grupos; }).filter(Boolean);
}

async function attachAutores(posts) {
  var ids = Array.from(new Set(posts.map(function (p) { return p.autor_id; })));
  if (!ids.length) return posts;
  var { data } = await sb.from('perfis').select('id, nome_completo').in('id', ids);
  var map = {}; (data || []).forEach(function (p) { map[p.id] = p.nome_completo; });
  posts.forEach(function (p) { p._autorNome = map[p.autor_id] || 'Cartório Eleitoral'; });
  return posts;
}

async function loadMural() {
  var { data } = await sb.from('mural_posts').select('*').eq('status', 'publicado').order('fixado', { ascending: false }).order('ordem', { ascending: false }).order('criado_em', { ascending: false });
  state.muralPosts = data || []; // autor individual não é exposto no mural público (RLS de perfis já barra e é o design certo)
  if (state.perfil.is_moderador || state.perfil.is_revisor) {
    var { data: pend } = await sb.from('mural_posts').select('*').eq('status', 'pendente').order('criado_em', { ascending: true });
    state.reviewQueue = await attachAutores(pend || []);
  } else { state.reviewQueue = []; }
  var idsQueExigem = state.muralPosts.filter(function (p) { return p.exige_confirmacao; }).map(function (p) { return p.id; });
  if (idsQueExigem.length) {
    var { data: conf } = await sb.from('mural_confirmacoes').select('mural_post_id').eq('perfil_id', state.session.user.id).in('mural_post_id', idsQueExigem);
    state.minhasConfirmacoes = (conf || []).map(function (c) { return c.mural_post_id; });
  } else { state.minhasConfirmacoes = []; }
  subscribeMural();
}

function contarPendentesConfirmacao() {
  return state.muralPosts.filter(function (p) { return p.exige_confirmacao && state.minhasConfirmacoes.indexOf(p.id) === -1; }).length;
}

function subscribeMural() {
  if (muralChannel) return;
  muralChannel = sb.channel('mural-live').on('postgres_changes', { event: '*', schema: 'public', table: 'mural_posts' }, function () {
    loadMural().then(render);
  }).subscribe();
}

async function loadThread(grupo) {
  state.activeGroupId = grupo.id; state.activeGroupMeta = grupo;
  state.screen = 'thread'; state.threadMessages = []; state.threadMembers = []; state.composeError = '';
  render();
  var msgsPromise = sb.from('mensagens').select('id, texto, criado_em, fixado, removida_em, autor_id, eh_informe, exige_confirmacao').eq('grupo_id', grupo.id).order('criado_em', { ascending: false }).limit(60);
  var membersPromise = state.perfil.is_moderador
    ? sb.from('memberships').select('perfil_id, papel, pode_postar, perfis(nome_completo, funcao)').eq('grupo_id', grupo.id)
    : Promise.resolve({ data: [] });
  var [msgsRes, membersRes] = await Promise.all([msgsPromise, membersPromise]);
  var msgs = msgsRes.data || [];
  var autorIds = Array.from(new Set(msgs.map(function (m) { return m.autor_id; })));
  var autorMap = {};
  if (autorIds.length) {
    var { data: autores } = await sb.from('perfis').select('id, nome_completo, nome_exibicao, is_moderador').in('id', autorIds);
    (autores || []).forEach(function (a) { autorMap[a.id] = a; });
  }
  msgs.forEach(function (m) { m._autor = autorMap[m.autor_id] || { nome_completo: 'Integrante' }; });
  state.threadMessages = msgs;
  state.threadMembers = (membersRes.data || []).map(function (row) {
    return { perfilId: row.perfil_id, name: row.perfis ? row.perfis.nome_completo : '—', role: row.perfis ? row.perfis.funcao : row.papel };
  });
  var minhaMembership = (membersRes.data || []).filter(function (row) { return row.perfil_id === state.session.user.id; })[0];
  state.souMembroComPostagem = !!(minhaMembership && minhaMembership.pode_postar);
  var idsQueExigem = msgs.filter(function (m) { return m.exige_confirmacao; }).map(function (m) { return m.id; });
  if (idsQueExigem.length) {
    var { data: conf } = await sb.from('mensagens_confirmacoes').select('mensagem_id').eq('perfil_id', state.session.user.id).in('mensagem_id', idsQueExigem);
    state.minhasConfirmacoesMensagens = (conf || []).map(function (c) { return c.mensagem_id; });
  } else { state.minhasConfirmacoesMensagens = []; }
  render();
  subscribeThread(grupo.id);
}

function subscribeThread(grupoId) {
  if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; }

function leaveThread() {

  if (!state.muralFormAudienciaTodos && !audiencia.length) { state.banner = 'Marque pelo menos um público, ou selecione "Todos".'; render(); return; }
  var campos = { titulo: titulo, texto: texto || null, visibilidade: audiencia, exige_confirmacao: state.muralFormExigeConfirmacao, passos: null, passos_titulo: null };
  if (state.muralFormComTopicos && passos.length) { campos.passos = passos; campos.passos_titulo = topicosTitulo; }
  var error;
  if (state.editingMuralId) {
    var res = await sb.from('mural_posts').update(campos).eq('id', state.editingMuralId);
    error = res.error;
  } else {
    var novo = Object.assign({ autor_id: state.session.user.id, status: 'pendente' }, campos);

  if (error) { state.banner = error.message; render(); return; }
  state.showMuralForm = false; state.editingMuralId = null; state.muralFormTitulo = ''; state.muralFormTexto = ''; state.muralFormPassos = [];
  state.muralFormComTopicos = false; state.muralFormTopicosTitulo = '';
  state.muralFormAudienciaTodos = true; state.muralFormAudiencia = []; state.muralFormExigeConfirmacao = false;
  await loadMural(); render();
}

function editarAvisoMural(id) {
  var post = state.muralPosts.concat(state.reviewQueue).filter(function (p) { return p.id === id; })[0];
  if (!post) return;
  state.editingMuralId = id;
  state.muralFormTitulo = post.titulo || '';
  state.muralFormTexto = post.texto || '';
  state.muralFormComTopicos = !!(post.passos && post.passos.length);
  state.muralFormTopicosTitulo = post.passos_titulo || '';
  state.muralFormPassos = (post.passos || []).map(function (p) { return { data: p.data || '', texto: p.texto || '' }; });
  var vis = post.visibilidade || ['todos'];
  state.muralFormAudienciaTodos = vis.indexOf('todos') !== -1;
  state.muralFormAudiencia = state.muralFormAudienciaTodos ? [] : vis.slice();
  state.muralFormExigeConfirmacao = !!post.exige_confirmacao;
  state.showMuralForm = true;
  render();
}

async function moverMural(id, direcao) {
  var { error } = await sb.rpc('mural_mover', { p_id: id, p_direcao: direcao });
  if (error) { state.banner = error.message; render(); return; }
  await loadMural(); render();
}

async function verHistoricoMural(id) {
  if (state.expandedHistoricoId === id) { state.expandedHistoricoId = null; render(); return; }
  if (!state.historicoMural[id]) {
    var { data, error } = await sb.from('mural_posts_historico').select('*, perfis(nome_completo)').eq('post_id', id).order('editado_em', { ascending: false });
    state.historicoMural[id] = error ? [] : (data || []);
  }
  state.expandedHistoricoId = id;
  render();
}

function toggleAudiencia(categoria) {
  var idx = state.muralFormAudiencia.indexOf(categoria);
  if (idx === -1) state.muralFormAudiencia.push(categoria); else state.muralFormAudiencia.splice(idx, 1);
  render();
}

async function confirmarLeitura(postId) {
  var { error } = await sb.from('mural_confirmacoes').insert({ mural_post_id: postId, perfil_id: state.session.user.id });
  if (error) { state.banner = error.message; render(); return; }
  state.minhasConfirmacoes.push(postId);
  render();
}

function renderHistoricoMural(id) {
  var itens = state.historicoMural[id] || [];
  if (!itens.length) return '<div class="historico-box"><div class="hint">Nenhuma edição anterior registrada.</div></div>';
  var html = '<div class="historico-box">';
  itens.forEach(function (h) {
    var autor = h.perfis ? h.perfis.nome_completo : 'Alguém';
    html += '<div class="historico-item"><strong>' + esc(h.titulo || '(sem título)') + '</strong>' +
      (h.texto ? '<div>' + esc(h.texto) + '</div>' : '') +
      '<div class="historico-meta">Versão anterior a esta edição · ' + esc(autor) + ' · ' + esc(fmtHora(h.editado_em)) + '</div></div>';
  });
  html += '</div>';
  return html;
}

var ROTULO_AUDIENCIA = { todos: 'Todos', administradores: 'Administradores', operadores: 'Operadores', mesarios: 'Mesários' };
function rotuloVisibilidade(visibilidade) {
  if (!visibilidade || !visibilidade.length || visibilidade.indexOf('todos') !== -1) return 'Todos';
  return visibilidade.map(function (v) { return ROTULO_AUDIENCIA[v] || v; }).join(' + ');
}

function toggleMuralExpand(id) {
  state.expandedMuralId = state.expandedMuralId === id ? null : id;

}
async function aprovarMural(id) {
  await sb.from('mural_posts').update({ status: 'publicado', revisado_por: state.session.user.id, revisado_em: new Date().toISOString(), publicado_em: new Date().toISOString() }).eq('id', id);
  await loadMural(); render();
}
async function rejeitarMural(id) {
  var motivo = prompt('Motivo da rejeição (fica registrado, opcional):') || null;
  await sb.from('mural_posts').update({ status: 'rejeitado', revisado_por: state.session.user.id, revisado_em: new Date().toISOString(), motivo_rejeicao: motivo }).eq('id', id);
  await loadMural(); render();
}

async function loadPainel() {
  var { data: grupos } = await sb.from('grupos').select('*').order('nome');
  state.allGroups = grupos || [];
  if (!state.newGroup && grupos && grupos.length) state.newGroup = grupos.find(function (g) { return g.slug !== 'geral'; }).slug;
  await loadPainelMembers();
}
async function loadPainelMembers() {
  var q = sb.from('memberships').select('perfil_id, grupo_id, papel, perfis(nome_completo, funcao), grupos(nome, slug)');
  if (state.painelFilter !== 'todos') {
    var g = state.allGroups.find(function (x) { return x.slug === state.painelFilter; });
    if (g) q = q.eq('grupo_id', g.id);
  }
  var { data } = await q;
  state.painelMembers = data || [];
  render();
}
async function removerIntegrante(perfilId, grupoId) {
  if (!confirm('Remover este integrante do grupo?')) return;
  await sb.from('memberships').delete().eq('perfil_id', perfilId).eq('grupo_id', grupoId);
  await loadPainelMembers();
}
async function adicionarIntegrante() {
  var email = state.newEmail.trim(), nome = state.newName.trim(), funcao = state.newFuncao.trim(), grupoSlug = state.newGroup;
  if (!email || !nome || !grupoSlug) return;
  state.banner = '';
  try {
    var { data: sessionData } = await sb.auth.getSession();
    var resp = await fetch(SUPABASE_URL + '/functions/v1/convidar-convocado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionData.session.access_token },
      body: JSON.stringify({ email: email, nome_completo: nome, funcao: funcao, grupo_slug: grupoSlug })
    });
    var json = await resp.json();
    if (!resp.ok) { state.banner = 'Não foi possível adicionar: ' + (json.error || resp.status); render(); return; }
  } catch (e) { state.banner = 'Não foi possível contatar o servidor de convite.'; render(); return; }
  state.showAddForm = false; state.newEmail = ''; state.newName = ''; state.newFuncao = '';
  await loadPainelMembers();
}

function renderPassosBloco(post) {
  if (!post.passos || !post.passos.length) return '';
  var expandido = state.expandedMuralId === post.id;

  var st = iconStyleFor(g);
  var nome = opts.rotulo || g.nome;
  return '<button class="group-card' + (opts.sub ? ' group-card-sub' : '') + '" data-action="open-group" data-group="' + g.id + '">' +
    '<div class="group-icon" style="background:' + st.bg + ';">' + icon(st.icon, 19, '#F7F5F0') + '</div>' +
    '<div style="flex:1 1 auto; min-width:0;"><div class="group-name">' + esc(nome) + '</div><div class="group-sub">' + esc(g.descricao || '') + '</div></div>' +
    icon('chevRight', 15, '#C6BFAE') + '</button>';
}

function renderGruposModerador() {
  var html = '';
  var bySlug = {};
  state.myGroups.forEach(function (g) { bySlug[g.slug] = g; });
  ['geral', 'operadores', 'administradores'].forEach(function (slug) {
    if (bySlug[slug]) html += groupCardHtml(bySlug[slug]);
  });
  var escolas = state.myGroups.filter(function (g) { return g.tipo === 'escola'; })
    .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
  escolas.forEach(function (esc1) {
    var aberta = state.expandedEscolaId === esc1.id;
    html += '<button class="group-card group-card-folder" data-action="toggle-escola" data-id="' + esc1.id + '">' +
      '<div class="group-icon" style="background:' + iconStyleFor(esc1).bg + ';">' + icon('school', 19, '#F7F5F0') + '</div>' +
      '<div style="flex:1 1 auto; min-width:0;"><div class="group-name">' + esc(esc1.nome) + '</div></div>' +
      icon(aberta ? 'arrowUp' : 'chev', 15, '#C6BFAE') + '</button>';
    if (aberta) {
      var geralDaEscola = state.myGroups.filter(function (g) { return g.tipo === 'escola_geral' && g.escola_id === esc1.id; })[0];
      var secoes = state.myGroups.filter(function (g) { return g.tipo === 'secao' && g.escola_id === esc1.id; })
        .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
      html += '<div class="group-subgroup">';
      if (geralDaEscola) html += groupCardHtml(geralDaEscola, { sub: true });
      html += groupCardHtml(esc1, { sub: true, rotulo: 'Administradores' });
      secoes.forEach(function (s) { html += groupCardHtml(s, { sub: true }); });
      html += '</div>';
    }
  });
  return html;
}

function renderGrupos() {
  var html = '<div class="eyebrow">Meus grupos</div>';
  if (state.perfil.is_moderador) {
    html += renderGruposModerador();
  } else {
    var ordenados = state.myGroups.slice().sort(function (a, b) {
      if (a.slug === 'geral') return -1;
      if (b.slug === 'geral') return 1;
      return 0;
    });
    ordenados.forEach(function (g) { html += groupCardHtml(g); });
  }
  if (!state.myGroups.length) html += '<div class="hint">Você ainda não está em nenhum grupo. Fale com o Cartório Eleitoral.</div>';
  else html += '<div class="hint">Você faz parte destes grupos conforme sua convocação no TRE-PE.</div>';
  return html;
}

function renderThread() {
  var html = '';
  if (state.threadMembers.length) {
    html += '<div class="members-box"><div class="eyebrow" style="margin-bottom:8px;">Integrantes (' + state.threadMembers.length + ')</div>';
    state.threadMembers.forEach(function (m, i) {
      var canRemove = state.perfil.is_moderador && m.perfilId !== state.session.user.id;
      html += '<div class="member-row"><div class="avatar" style="background:' + AVATAR_COLORS[i % AVATAR_COLORS.length] + ';">' + initials(m.name) + '</div>' +
        '<div style="flex:1 1 auto; min-width:0;"><div class="member-name">' + esc(m.name) + '</div><div class="member-role">' + esc(m.role || '') + '</div></div>' +
        (canRemove ? '<button class="remove-btn" data-action="remove-member" data-id="' + m.perfilId + '" data-grupo="' + state.activeGroupId + '">' + icon('x', 13) + '</button>' : '') +
        '</div>';
    });
    html += '</div>';
  }
  var prevAuthor = null;
  state.threadMessages.forEach(function (m) {
    var authorName = nomeExibir(m._autor) + (m._autor.id === state.session.user.id ? ' (você)' : '');
    var sameAsPrev = m.autor_id === prevAuthor && !m.eh_informe;
    var authorColor = m._autor.is_moderador ? '#C79A3D' : '#16294B';
    html += '<div class="message-card' + (sameAsPrev ? ' grouped' : '') + (m.eh_informe ? ' message-informe' : '') + '">';
    if (m.eh_informe) {
      html += '<div class="pin-tag" style="margin-bottom:4px;">' + icon('pin', 12, 'none', '#C79A3D') + '<span class="pin-label">Informe do Cartório</span></div>';
    }
    if (sameAsPrev) {
      html += '<div class="pin-row grouped-row"><div>' + (m.fixado ? icon('pin', 12, 'none', '#C79A3D') : '') + '</div><span style="font-size:10.5px; color:#9B9484;">' + esc(fmtHora(m.criado_em)) + '</span></div>';
    } else {
      html += '<div class="pin-row"><div class="pin-tag">' + (m.fixado ? icon('pin', 12, 'none', '#C79A3D') : '') + '<span style="font-size:12px; font-weight:700; color:' + authorColor + ';">' + esc(authorName) + '</span></div>' +
        '<span style="font-size:10.5px; color:#9B9484;">' + esc(fmtHora(m.criado_em)) + '</span></div>';
    }
    if (m.removida_em) {
      html += '<div class="msg-removed">Mensagem removida pela moderação.</div>';
    } else {
      html += '<div class="post-text">' + esc(m.texto) + '</div>';
      if (state.perfil.is_moderador) html += '<button class="del-msg-btn" data-action="remove-message" data-id="' + m.id + '">' + icon('x', 12) + '</button>';
      if (m.exige_confirmacao) {
        var confirmado = state.minhasConfirmacoesMensagens.indexOf(m.id) !== -1;
        if (confirmado) {
          html += '<div class="hint" style="margin-top:8px; color:#3E6E4E;">' + icon('chev', 12, '#3E6E4E') + ' Leitura confirmada</div>';
        } else {
          html += '<button class="btn-approve" style="margin-top:8px; width:100%;" data-action="confirmar-leitura-mensagem" data-id="' + m.id + '">Confirmar leitura</button>';
        }
      }
    }
    html += '</div>';
    prevAuthor = m.autor_id;
  });
  if (!state.threadMessages.length) html += '<div class="hint">Nenhuma mensagem ainda neste grupo.</div>';
  return html;
}

function canPostHint() {
  if (!state.activeGroupMeta) return false;
  if (state.activeGroupMeta.slug === 'geral') return state.perfil.is_moderador;
  if (state.perfil.is_moderador) return state.souMembroComPostagem;
  return true;
}

function renderInformeBox() {
  if (!state.perfil.is_moderador || state.activeGroupMeta.slug === 'geral') return '';

function renderThreadComposer() {
  var html = renderInformeBox() + '<div class="composer">';
  if (!state.online) {
    html += '<div class="composer-blocked">Sem conexão — a mensagem será enviada ao reconectar.</div>';
  } else if (!canPostHint()) {
    html += '<div class="composer-blocked">' + (state.activeGroupMeta.slug === 'geral'
      ? 'O Geral é o canal oficial do Cartório — só o TRE publica aqui.'
      : 'Você está vendo este grupo como moderador, mas não é integrante dele — só acompanha, não posta aqui.') + '</div>';

    html += '<div class="composer-row"><input type="text" id="compose-input" placeholder="Escrever mensagem…" value="' + esc(state.composeText) + '">' +

    if (state.composeError) html += '<div class="banner-error" style="margin-top:8px; margin-bottom:0;">' + esc(state.composeError) + '</div>';

  html += '</div>';

function renderFaq() {
  var html = '<div class="search-box">' + icon('search', 16, '#8A8271') + '<input type="text" id="faq-search-input" placeholder="Buscar no FAQ (ex: urna, PIX, zerésima)" value="' + esc(state.faqSearch) + '"></div>';
  if (state.faqSearch.trim().length > 0) {
    var q = state.faqSearch.trim().toLowerCase(); var results = [];
    FAQ_CAT_ORDER.forEach(function (catId) {
      FAQ_DATA[catId].items.forEach(function (item, idx) {
        if ((item.q + ' ' + item.a).toLowerCase().indexOf(q) !== -1) results.push({ catName: FAQ_DATA[catId].name, key: catId + '-' + idx, q: item.q, a: item.a });
      });
    });
    html += '<div class="eyebrow">' + results.length + ' resultado(s) para "' + esc(state.faqSearch.trim()) + '"</div>';
    results.forEach(function (r) { html += renderFaqItem(r); });
  } else if (state.activeFaqCat) {
    var cat = FAQ_DATA[state.activeFaqCat];
    html += '<button class="link-btn" data-action="faq-back" style="margin-bottom:12px;">' + icon('back', 14) + ' Categorias</button><div class="eyebrow">' + esc(cat.name) + '</div>';
    cat.items.forEach(function (item, idx) { html += renderFaqItem({ key: state.activeFaqCat + '-' + idx, q: item.q, a: item.a }); });
  } else {
    html += '<div class="eyebrow">Categorias</div>';
    FAQ_CAT_ORDER.forEach(function (catId) {
      var cat = FAQ_DATA[catId];
      var iconName = { urna: 'urna', encerramento: 'logout', justificativa: 'doc', financeiro: 'cifrao', midia: 'broadcast', fiscalizacao: 'shield', vestuario: 'vest' }[catId];
      html += '<button class="group-card" data-action="open-faq-cat" data-cat="' + catId + '"><div class="faq-cat-icon">' + icon(iconName, 18) + '</div>' +
        '<div style="flex:1 1 auto;"><div class="faq-cat-name">' + esc(cat.name) + '</div><div class="faq-cat-count">' + cat.items.length + ' perguntas</div></div>' + icon('chevRight', 15, '#C6BFAE') + '</button>';
    });
  }
  return html;
}
function renderFaqItem(item) {
  var expanded = state.expandedFaqId === item.key;
  var html = '<div class="card">';
  if (item.catName) html += '<div class="faq-cat-tag">' + esc(item.catName) + '</div>';
  html += '<button class="faq-q-btn" data-action="toggle-faq" data-key="' + item.key + '"><span class="faq-q">' + esc(item.q) + '</span>' +
    '<span style="flex:0 0 auto; margin-top:2px; display:flex; transform:' + (expanded ? 'rotate(180deg)' : 'rotate(0deg)') + ';">' + icon('chev', 14, '#8A8271') + '</span></button>';
  if (expanded) html += '<div class="faq-a">' + esc(item.a) + '</div>';
  html += '</div>'; return html;
}

async function salvarNomeExibicao() {
  var valor = state.perfilFormNomeExibicao.trim() || null;
  var { error } = await sb.from('perfis').update({ nome_exibicao: valor }).eq('id', state.session.user.id);
  if (error) { state.banner = error.message; render(); return; }
  state.perfil.nome_exibicao = valor;
  state.perfilNomeSalvo = true;
  render();
}

  if (p.is_moderador) {

function renderPainel() {

      '<div style="flex:1 1 auto; min-width:0;"><div class="member-name">' + esc(m.perfis ? m.perfis.nome_completo : '—') + '</div><div class="member-role">' + esc(m.perfis ? m.perfis.funcao : '') + ' · ' + esc(m.grupos ? m.grupos.nome : '') + '</div></div>' +

      '<input type="text" id="new-name-input" placeholder="Nome completo" value="' + esc(state.newName) + '">' +
      '<input type="text" id="new-funcao-input" placeholder="Função (ex: 2º Mesário)" value="' + esc(state.newFuncao) + '">' +
      '<select id="new-group-select">';

      html += '<option value="' + g.slug + '"' + (state.newGroup === g.slug ? ' selected' : '') + '>' + esc(g.nome) + '</option>';
    });

function renderBottomNav() {
  if (state.screen === 'thread') return '';
  function item(screen, action, iconName, label, badge) {
    var active = state.screen === screen;
    return '<button class="nav-btn' + (active ? ' active' : '') + '" data-action="' + action + '">' +
      '<span style="position:relative; display:inline-flex;">' + icon(iconName, 21) +
      (badge ? '<span style="position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:#C79A3D; border:2px solid #fff;"></span>' : '') +
      '</span><span class="nav-label">' + label + '</span></button>';
  }
  var pendentes = contarPendentesConfirmacao();
  return '<div class="bottomnav">' + item('mural', 'nav-mural', 'home', 'Mural', pendentes > 0) + item('grupos', 'nav-grupos', 'ballot', 'Grupos') + item('faq', 'nav-faq', 'search', 'FAQ') + item('perfil', 'nav-perfil', 'school', 'Perfil') + '</div>';
}

function render() {
  var focus = null;
  var ae = document.activeElement;
  if (ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) focus = { id: ae.id, start: ae.selectionStart, end: ae.selectionEnd };
  var app = document.getElementById('app');
  var html;
  if (state.screen === 'loading') html = renderLoading();
  else if (state.screen === 'login') html = renderLogin();
  else {
    var body = '';
    if (state.screen === 'mural') body = renderMural();
    else if (state.screen === 'grupos') body = renderGrupos();
    else if (state.screen === 'thread') body = renderThread();
    else if (state.screen === 'faq') body = renderFaq();
    else if (state.screen === 'perfil') body = renderPerfil();
    else if (state.screen === 'painel') body = renderPainel();
    html = renderHeader() + '<div class="scroll">' + (state.banner ? '<div class="banner-error">' + esc(state.banner) + '</div>' : '') + body + '</div>';
    if (state.screen === 'thread') html += renderThreadComposer();
    html += renderBottomNav();
  }
  app.innerHTML = html;
  if (focus) {
    var el = document.getElementById(focus.id);
    if (el) { el.focus(); if (el.setSelectionRange && (el.type === 'text' || el.type === 'email' || !el.type)) { try { el.setSelectionRange(focus.start, focus.end); } catch (e) {} } }
  }
}

function go(screen) {
  if (screen !== 'thread') leaveThread();
  state.screen = screen; state.banner = '';
  if (screen === 'painel') loadPainel();
  render();
}

// ================= EVENTOS =================
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  if (action === 'solicitar-codigo') solicitarCodigo();
  else if (action === 'confirmar-codigo') confirmarCodigo();
  else if (action === 'verificar-sessao') verificarSessao();
  else if (action === 'voltar-identidade') voltarParaIdentidade();
  else if (action === 'logout') logout();
  else if (action === 'nav-mural') go('mural');
  else if (action === 'nav-grupos') go('grupos');
  else if (action === 'nav-faq') go('faq');
  else if (action === 'nav-perfil') go('perfil');
  else if (action === 'back-to-grupos') go('grupos');
  else if (action === 'toggle-escola') {
    var id = el.getAttribute('data-id');
    state.expandedEscolaId = state.expandedEscolaId === id ? null : id;
    render();
  }
  else if (action === 'open-group') {
    var g = state.myGroups.find(function (x) { return x.id === el.getAttribute('data-group'); });
    if (g) loadThread(g);
  }
  else if (action === 'open-painel') go('painel');
  else if (action === 'salvar-nome-exibicao') salvarNomeExibicao();
  else if (action === 'send-message') sendMessage();
  else if (action === 'remove-message') removeMessage(el.getAttribute('data-id'));
  else if (action === 'remove-member' || action === 'remove-integrante') removerIntegrante(el.getAttribute('data-id'), el.getAttribute('data-grupo'));
  else if (action === 'faq-back') { state.activeFaqCat = null; state.faqSearch = ''; render(); }
  else if (action === 'open-faq-cat') { state.activeFaqCat = el.getAttribute('data-cat'); render(); }
  else if (action === 'toggle-faq') toggleFaqItem(el.getAttribute('data-key'));
  else if (action === 'abrir-form-mural') { state.showMuralForm = true; state.editingMuralId = null; render(); }
  else if (action === 'cancelar-mural') { state.showMuralForm = false; state.editingMuralId = null; state.muralFormTitulo = ''; state.muralFormTexto = ''; state.muralFormPassos = []; state.muralFormComTopicos = false; state.muralFormTopicosTitulo = ''; state.muralFormAudienciaTodos = true; state.muralFormAudiencia = []; state.muralFormExigeConfirmacao = false; render(); }
  else if (action === 'editar-mural') editarAvisoMural(el.getAttribute('data-id'));
  else if (action === 'mover-mural-cima') moverMural(el.getAttribute('data-id'), 'cima');
  else if (action === 'mover-mural-baixo') moverMural(el.getAttribute('data-id'), 'baixo');
  else if (action === 'ver-historico-mural') verHistoricoMural(el.getAttribute('data-id'));
  else if (action === 'toggle-topicos') { state.muralFormComTopicos = !state.muralFormComTopicos; if (state.muralFormComTopicos && !state.muralFormPassos.length) state.muralFormPassos.push({ data: '', texto: '' }); render(); }
  else if (action === 'audiencia-todos') { state.muralFormAudienciaTodos = true; render(); }
  else if (action === 'audiencia-mescla') { state.muralFormAudienciaTodos = false; render(); }
  else if (action === 'toggle-audiencia') toggleAudiencia(el.getAttribute('data-cat'));
  else if (action === 'toggle-exige-confirmacao') { state.muralFormExigeConfirmacao = !state.muralFormExigeConfirmacao; render(); }
  else if (action === 'confirmar-leitura') confirmarLeitura(el.getAttribute('data-id'));
  else if (action === 'confirmar-leitura-mensagem') confirmarLeituraMensagem(el.getAttribute('data-id'));
  else if (action === 'abrir-form-informe') { state.showInformeForm = true; render(); }
  else if (action === 'cancelar-informe') { state.showInformeForm = false; state.informeFormTexto = ''; state.informeFormExigeConfirmacao = false; render(); }
  else if (action === 'toggle-informe-confirmacao') { state.informeFormExigeConfirmacao = !state.informeFormExigeConfirmacao; render(); }
  else if (action === 'enviar-informe') postarInforme();
  else if (action === 'enviar-mural') criarAvisoMural();
  else if (action === 'aprovar-mural') aprovarMural(el.getAttribute('data-id'));
  else if (action === 'rejeitar-mural') rejeitarMural(el.getAttribute('data-id'));
  else if (action === 'adicionar-passo') adicionarPasso();
  else if (action === 'remover-passo') removerPasso(parseInt(el.getAttribute('data-idx'), 10));
  else if (action === 'toggle-mural-expand') toggleMuralExpand(el.getAttribute('data-id'));
  else if (action === 'painel-filter') { state.painelFilter = el.getAttribute('data-filter'); loadPainelMembers(); }
  else if (action === 'abrir-add') { state.showAddForm = true; render(); }
  else if (action === 'cancelar-add') { state.showAddForm = false; render(); }
  else if (action === 'confirmar-add') adicionarIntegrante();
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  var passoIdx = e.target.getAttribute && e.target.getAttribute('data-passo-idx');
  if (passoIdx !== null && passoIdx !== undefined) {
    var campo = e.target.getAttribute('data-passo-campo');
    if (state.muralFormPassos[passoIdx]) state.muralFormPassos[passoIdx][campo] = e.target.value;
    return;
  }
  if (id === 'login-nome-input') { state.loginNome = maskNome(e.target.value); aplicarMascara(e.target, state.loginNome); }
  else if (id === 'login-cpf-input') { state.loginCpf = maskCPF(e.target.value); aplicarMascara(e.target, state.loginCpf); }
  else if (id === 'login-titulo-input') { state.loginTitulo = maskTitulo(e.target.value); aplicarMascara(e.target, state.loginTitulo); }
  else if (id === 'login-nascimento-input') { state.loginNascimento = maskData(e.target.value); aplicarMascara(e.target, state.loginNascimento); }
  else if (id === 'login-codigo-input') state.loginCodigo = e.target.value;
  else if (id === 'faq-search-input') { state.faqSearch = e.target.value; state.activeFaqCat = null; render(); }
  else if (id === 'compose-input') state.composeText = e.target.value;
  else if (id === 'mural-titulo-input') state.muralFormTitulo = e.target.value;
  else if (id === 'mural-texto-input') state.muralFormTexto = e.target.value;
  else if (id === 'mural-topicos-titulo-input') state.muralFormTopicosTitulo = e.target.value;
  else if (id === 'new-email-input') state.newEmail = e.target.value;
  else if (id === 'new-name-input') state.newName = e.target.value;
  else if (id === 'new-funcao-input') state.newFuncao = e.target.value;
  else if (id === 'nome-exibicao-input') { state.perfilFormNomeExibicao = e.target.value; state.perfilNomeSalvo = false; }
  else if (id === 'informe-texto-input') state.informeFormTexto = e.target.value;
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'compose-input') sendMessage();
  else if (e.target.id === 'login-nascimento-input') solicitarCodigo();
  else if (e.target.id === 'login-codigo-input') confirmarCodigo();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'new-group-select') state.newGroup = e.target.value;
  else if (e.target.id === 'login-aceite-checkbox') { state.loginAceite = e.target.checked; render(); }
});
window.addEventListener('online', function () { state.online = true; render(); });
window.addEventListener('offline', function () { state.online = false; render(); });

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
