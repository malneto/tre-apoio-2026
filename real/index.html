  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ECE8DE; overscroll-behavior-y: none; }

  .header-title { font-size: 15px; font-weight: 700; color: var(--paper); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub { font-size: 11.5px; font-weight: 500; color: #B9C3D6; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .offline-banner { padding: 7px 16px; background: #3A2E12; display: flex; align-items: center; gap: 8px; }

  .offline-text { font-size: 11px; color: #F0D9A6; line-height: 1.3; }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }

  .post-author { font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 5px; }

  .icon-btn { background: #F7F0E8; border: none; border-radius: 7px; width: 30px; height: 30px; flex: 0 0 auto; color: var(--navy); display: flex; align-items: center; justify-content: center; }

  .historico-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }
  .historico-item { font-size: 12px; color: #4A473E; }
  .historico-meta { font-size: 11px; color: #9B9484; margin-top: 2px; }

  .group-meta { text-align: right; flex: 0 0 auto; }

  .member-name { font-size: 12.5px; font-weight: 600; color: #2B2A25; }

  .remove-btn { background: #F7F0E8; border: none; border-radius: 7px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: #A24B3E; flex: 0 0 auto; }

  .faq-cat-name { font-size: 13.5px; font-weight: 700; color: var(--navy); }

  .faq-q-btn { width: 100%; text-align: left; background: none; border: none; padding: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .faq-q { font-size: 13.5px; font-weight: 600; color: var(--navy); line-height: 1.4; }

  .faq-cat-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }

  .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: var(--paper); font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .profile-name { font-size: 16px; font-weight: 700; color: var(--navy); }
  .profile-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .profile-badge { display: inline-block; margin-top: 10px; padding: 4px 10px; background: #F1ECE0; border-radius: 20px; font-size: 11.5px; font-weight: 600; color: var(--navy); }
  .audience-badge { display: inline-block; margin-top: 10px; padding: 4px 12px; background: var(--navy); border: 1px solid var(--navy); border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #F7F5F0; }
  .info-list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px 14px; margin-bottom: 14px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--divider); }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 12.5px; color: var(--muted); }
  .info-value { font-size: 12.5px; font-weight: 600; color: #2B2A25; }
  .toggle-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }

  .toggle-desc { font-size: 11.5px; color: #9B9484; margin-top: 2px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; border: none; position: relative; flex: 0 0 auto; }
  .switch-knob { width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 3px; transition: left .15s; }
  .cta-btn { width: 100%; margin-top: 12px; background: var(--navy); color: var(--paper); border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }

  .filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }

  .banner-error { background: #FBEAE6; border: 1px solid #E9B4A6; color: #8A3D2E; border-radius: 8px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }
</style>

// ================= Instalar como app (tela de início) =================
// Android/Chrome/Edge: o navegador dispara beforeinstallprompt e a gente
// guarda o evento pra disparar sob demanda quando a pessoa toca no botão —
// sem isso, dá pra instalar só pelo menu escondido do navegador.
// iOS (Safari e qualquer navegador lá, todos são WebKit por baixo): a Apple
// não deixa nenhum site disparar a instalação por código, de propósito —
// o máximo que dá pra fazer é mostrar o passo a passo (Compartilhar >
// Adicionar à Tela de Início) de um jeito mais claro que o padrão do iOS.
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  return (window.navigator.standalone === true) || window.matchMedia('(display-mode: standalone)').matches;

window.addEventListener('beforeinstallprompt', function (e) {

  deferredInstallPrompt = null;

});
async function instalarApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    var escolha = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (escolha.outcome === 'accepted') state.appRecemInstalado = true;
    render();

// ================= LOCAL-FIRST: cache local + fila de envio =================
// Leitura: cada tela mostra o que já tem salvo no aparelho NA HORA (sem
// esperar rede) e atualiza sozinha por trás quando a resposta do servidor
// chega — troca de tela deixa de esperar uma ida e volta até o Supabase.
// Escrita (mensagem/informe): aparece na hora na tela (otimista), guardada
// numa fila local até o servidor confirmar; se cair a conexão, fica na fila
// e reenvia sozinho quando voltar; se o servidor RECUSAR (flood, sem
// permissão etc.), marca só aquela mensagem como "não enviada" — não fica
// tentando de novo sozinho, porque recusa de validação não é problema de
// rede, tentar de novo ia falhar do mesmo jeito.
function lsChave(sufixo) {
  var uid = (state.session && state.session.user && state.session.user.id) || 'anon';
  return 'tre2026:' + uid + ':' + sufixo;
}
function lsGet(sufixo, valorPadrao) {
  try {
    var bruto = localStorage.getItem(lsChave(sufixo));
    return bruto !== null ? JSON.parse(bruto) : valorPadrao;
  } catch (e) { return valorPadrao; }
}
function lsSet(sufixo, valor) {
  try { localStorage.setItem(lsChave(sufixo), JSON.stringify(valor)); } catch (e) { /* quota cheia ou navegação privada — segue só em memória */ }
}
function lsLimparTudoDoUsuario() {
  try {
    var prefixo = lsChave('');
    Object.keys(localStorage).filter(function (k) { return k.indexOf(prefixo) === 0; }).forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
}

// ================= AUTH / BOOT =================
async function boot() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('erro') === '1') state.banner = 'Não foi possível concluir o acesso. Peça um novo link.';

  // Supabase devolve erro de link (expirado, já usado, inválido) no #hash da URL.
  var hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  if (hashParams.get('error')) {
    var codigoErro = hashParams.get('error_code') || '';
    state.banner = codigoErro === 'otp_expired'
      ? 'Esse link expirou ou já foi usado. Peça um novo — cada link vale por poucos minutos e só funciona uma vez.'
      : 'Não foi possível concluir o acesso por esse link. Peça um novo.';
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  var { data } = await sb.auth.getSession();
  if (data.session) { await onSignedIn(data.session); } else { state.screen = 'login'; render(); }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'SIGNED_IN' && session && (!state.session || state.session.user.id !== session.user.id)) onSignedIn(session);
    else if (event === 'SIGNED_OUT') {
      // um SIGNED_OUT automático (token velho de sessão anterior falhando
      // ao renovar sozinho, corrida entre abas) tava derrubando login válido
      // sem avisar, mesmo com a checagem de getSession() — só aceita esse
      // evento quando a PESSOA mesma pediu (logout()/encerrarSessaoForcado()
      // ligam essa bandeira antes de chamar signOut()); qualquer outro
      // SIGNED_OUT "espontâneo" é ignorado.
      if (!logoutFoiPedidoPelaPessoa) return;
      logoutFoiPedidoPelaPessoa = false;
      state.session = null; state.perfil = null; state.screen = 'login'; render();
    }
  });
}

async function onSignedIn(session) {
  state.session = session;
  state.outbox = lsGet('outbox', []);

  // mostra o perfil salvo (se tiver) na hora, sem esperar a rede — o Mural
  // já pode aparecer com dado antigo enquanto a versão nova chega por trás
  var perfilCache = lsGet('perfil', null);
  if (perfilCache) {
    state.perfil = perfilCache;
    state.perfilFormNomeExibicao = perfilCache.nome_exibicao || '';
    state.perfilFormChavePix = perfilCache.chave_pix || '';
    state.screen = 'mural';
    state.muralPosts = lsGet('muralPosts', []);
    state.myGroups = lsGet('myGroups', []);
    render();
  }

  var { data: perfil, error } = await sb.from('perfis').select('id, nome_completo, nome_exibicao, funcao, subfuncao, chave_pix, is_moderador, is_revisor, ativo, criado_em, consentimento_em, email_verificado').eq('id', session.user.id).single();
  if (error || !perfil) {
    if (perfilCache) return; // já está mostrando o que tem em cache — provável só falta de rede, não desloga à toa
    state.banner = 'Sua conta ainda não está liberada neste app. Fale com o Cartório Eleitoral.';
    await sb.auth.signOut();
    return;
  }
  // email_verificado da linha de perfis é "já verificou alguma vez" (histórico) —
  // o que realmente libera postar é a SESSÃO atual estar confirmada
  // (aparelho novo tem que confirmar de novo, mesmo a conta já tendo
  // verificado antes em outro aparelho). RPC roda a mesma checagem que a
  // RLS de escrita usa de verdade, então bate certinho com o que o servidor
  // vai aceitar ou não.
  var { data: sessaoVerificada } = await sb.rpc('email_verificado');
  perfil.email_verificado = !!sessaoVerificada;
  state.perfil = perfil;
  lsSet('perfil', perfil);
  state.perfilFormNomeExibicao = perfil.nome_exibicao || '';
  state.perfilFormChavePix = perfil.chave_pix || '';
  state.screen = 'mural';
  try {
    await Promise.all([loadMural(), loadMyGroups()]);
  } catch (e) {
    // corrida rara: um token velho tentando renovar sozinho ao mesmo tempo
    // (ex.: sessão anterior desta mesma aba anônima) pode derrubar
    // state.session bem no meio desse carregamento — sem isso, a tela
    // ficava travada "pensando" pra sempre, porque o render() nunca era
    // alcançado. Mostra o que der pra mostrar e segue.
  }
  render();
  flushOutbox();
}

async function solicitarCodigo() {
  var cpf = state.loginCpf.trim(), titulo = state.loginTitulo.trim(), nome = state.loginNome.trim(), nascimento = state.loginNascimento.trim();
  if (!cpf || !titulo || !nome || !nascimento) { state.loginStatus = 'error:Preencha CPF, título, nome completo e data de nascimento.'; render(); return; }
  if (!state.loginAceite) { state.loginStatus = 'error:Marque o aceite do uso dos dados pra continuar.'; render(); return; }
  state.loginSending = true; state.loginStatus = ''; render();
  try {
    var resp = await fetch(SUPABASE_URL + '/functions/v1/solicitar-acesso', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cpf: cpf, titulo: titulo, nome: nome, data_nascimento: nascimento, consentimento: true })
    });
    var json = await resp.json();
    if (!resp.ok) {
      state.loginSending = false;
      state.loginStatus = 'error:' + (json.error || 'Não foi possível verificar seus dados agora. Tente de novo em instantes.');
      render();
      return;
    }
    if (!json.hashed_token) {
      // resposta genérica (não bateu) — não revela se o cadastro existe ou não
      state.loginSending = false;
      state.loginStatus = 'ok:' + json.mensagem;
      render();
      return;
    }
    // bateu: login de leitura instantâneo, sem esperar e-mail nenhum
    var { error } = await sb.auth.verifyOtp({ token_hash: json.hashed_token, type: 'magiclink' });
    state.loginSending = false;
    if (error) { state.loginStatus = 'error:Não foi possível liberar o acesso agora. Tente de novo.'; render(); return; }
    // sucesso: onAuthStateChange (SIGNED_IN) cuida da navegação pro app
  } catch (e) {
    state.loginSending = false; state.loginStatus = 'error:Sem conexão com o servidor. Tente novamente.'; render();
  }
}

async function logout() {
  logoutFoiPedidoPelaPessoa = true;
  lsLimparTudoDoUsuario();
  await sb.auth.signOut();
  state.loginCpf = ''; state.loginTitulo = ''; state.loginNome = ''; state.loginNascimento = ''; state.loginAceite = false;
}

// Botão de escape na própria tela de login — pra quando algo trava/pisca
// entre logado e deslogado (token velho de sessão anterior, por exemplo) e
// a pessoa não consegue nem chegar na aba Perfil pra usar o logout normal.
// Mais agressivo que o logout comum: limpa TODO o cache local do app
// (qualquer usuário, não só o da sessão atual — que pode estar quebrada).
async function encerrarSessaoForcado() {
  logoutFoiPedidoPelaPessoa = true;
  try {
    Object.keys(localStorage).filter(function (k) { return k.indexOf('tre2026:') === 0; }).forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
  try { await sb.auth.signOut(); } catch (e) {}
  state.session = null; state.perfil = null;
  state.loginCpf = ''; state.loginTitulo = ''; state.loginNome = ''; state.loginNascimento = ''; state.loginAceite = false;
  state.screen = 'login';
  state.loginStatus = 'ok:Sessão encerrada e dados locais limpos. Pode tentar entrar de novo.';
  render();
}

async function loadMyGroups() {
  if (!state.session) return; // sessão pode ter caído por uma corrida de renovação de token — não quebra, só desiste quieto
  if (state.perfil.is_moderador) {
    // moderador (Rita/Fernanda/desenvolvedor) enxerga todos os grupos pra
    // acompanhar tudo, mesmo sem ser membro formal de cada um — condiz com
    // a RLS de mensagens, que já libera leitura irrestrita pra moderador.
    var { data: todos, error: todosErr } = await sb.from('grupos').select('id,slug,nome,descricao,tipo,escola_id').order('nome');
    if (todosErr) { if (!state.myGroups.length) state.banner = todosErr.message; }
    else { state.myGroups = todos || []; lsSet('myGroups', state.myGroups); }
  } else {
    var { data, error } = await sb.from('memberships').select('grupo_id, papel, grupos(id,slug,nome,descricao,tipo,escola_id)').eq('perfil_id', state.session.user.id);
    if (error) { if (!state.myGroups.length) state.banner = error.message; }
    else { state.myGroups = (data || []).map(function (row) { return row.grupos; }).filter(Boolean); lsSet('myGroups', state.myGroups); }
  }
  await carregarNaoLidos();
}

async function carregarNaoLidos() {
  var { data, error } = await sb.rpc('grupos_nao_lidos');
  if (error) return;
  state.gruposNaoLidos = (data || []).map(function (r) { return r.grupo_id; });
}

async function marcarGrupoComoVisto(grupoId) {
  await sb.from('grupos_visto').upsert({ perfil_id: state.session.user.id, grupo_id: grupoId, visto_em: new Date().toISOString() }, { onConflict: 'perfil_id,grupo_id' });
  var idx = state.gruposNaoLidos.indexOf(grupoId);
  if (idx !== -1) { state.gruposNaoLidos.splice(idx, 1); render(); }
}

async function attachAutores(posts) {
  var ids = Array.from(new Set(posts.map(function (p) { return p.autor_id; })));
  if (!ids.length) return posts;
  var { data } = await sb.from('perfis').select('id, nome_completo').in('id', ids);
  var map = {}; (data || []).forEach(function (p) { map[p.id] = p.nome_completo; });
  posts.forEach(function (p) { p._autorNome = map[p.autor_id] || 'Cartório Eleitoral'; });
  return posts;
}

async function loadMural() {
  if (!state.session) return; // sessão pode ter caído por uma corrida de renovação de token — não quebra, só desiste quieto
  var vejoPendentes = state.perfil.is_moderador || state.perfil.is_revisor;
  var publicadosPromise = sb.from('mural_posts').select('*').eq('status', 'publicado').is('removida_em', null).order('fixado', { ascending: false }).order('ordem', { ascending: false }).order('criado_em', { ascending: false });
  var pendentesPromise = vejoPendentes
    ? sb.from('mural_posts').select('*').eq('status', 'pendente').is('removida_em', null).order('criado_em', { ascending: true })
    : Promise.resolve({ data: [] });
  var resultados = await Promise.all([publicadosPromise, pendentesPromise]);
  state.muralPosts = resultados[0].data || []; // autor individual não é exposto no mural público (RLS de perfis já barra e é o design certo)
  lsSet('muralPosts', state.muralPosts);
  state.reviewQueue = vejoPendentes ? await attachAutores(resultados[1].data || []) : [];
  var idsQueExigem = state.muralPosts.filter(function (p) { return p.exige_confirmacao; }).map(function (p) { return p.id; });
  if (idsQueExigem.length) {
    var { data: conf } = await sb.from('mural_confirmacoes').select('mural_post_id').eq('perfil_id', state.session.user.id).in('mural_post_id', idsQueExigem);
    state.minhasConfirmacoes = (conf || []).map(function (c) { return c.mural_post_id; });
  } else { state.minhasConfirmacoes = []; }
  subscribeMural();
}

function contarPendentesConfirmacao() {
  return state.muralPosts.filter(function (p) { return p.exige_confirmacao && state.minhasConfirmacoes.indexOf(p.id) === -1; }).length;
}

function subscribeMural() {
  if (muralChannel) return;
  muralChannel = sb.channel('mural-live').on('postgres_changes', { event: '*', schema: 'public', table: 'mural_posts' }, function () {
    loadMural().then(render);
  }).subscribe();
}

// Junta na lista de mensagens qualquer item ainda pendente na fila de envio
// pra esse grupo (mandado mas o servidor ainda não confirmou, ou tentando de
// novo por falta de conexão) — sem isso, um reload da thread (troca de tela,
// evento do Realtime) faria a mensagem que a pessoa acabou de mandar sumir
// da tela até o envio de verdade terminar.
function mesclarPendentesNaThread(grupoId) {
  var pendentes = state.outbox.filter(function (o) { return o.tipo === 'mensagem' && o.grupoId === grupoId; });
  pendentes.forEach(function (o) {
    var existente = state.threadMessages.find(function (m) { return m.id === o.tempId; });
    if (existente) {
      // já está na tela (injetada como "Enviando…" antes) — só atualiza o
      // status pro que o item da fila tem agora, não duplica
      existente._pendente = !o.falhou; existente._falhou = !!o.falhou; existente._erro = o.erro || null;
      return;
    }
    // a mensagem pode já ter chegado com o ID DE VERDADE (um recarregamento
    // completo — troca de tela, eco do Realtime — venceu a corrida contra a
    // confirmação do próprio envio) — sem checar isso, injeta um fantasma
    // "Enviando…" duplicado ao lado da mensagem real que já apareceu.
    var jaChegouDeVerdade = state.threadMessages.some(function (m) {
      return !m._pendente && m.autor_id === state.session.user.id && m.texto === o.texto && !!m.eh_informe === !!o.ehInforme &&
        Math.abs(new Date(m.criado_em).getTime() - new Date(o.criado_em).getTime()) < 5 * 60 * 1000;
    });
    if (jaChegouDeVerdade) return;
    // ordem cronológica (mais antiga em cima, mais nova embaixo, igual
    // WhatsApp) — item novo/pendente sempre entra no FIM, nunca no início.
    state.threadMessages.push({
      id: o.tempId, texto: o.texto, criado_em: o.criado_em, fixado: false, removida_em: null,
      autor_id: state.session.user.id, eh_informe: !!o.ehInforme, exige_confirmacao: !!o.exigeConfirmacao,
      _autor: state.perfil, _pendente: !o.falhou, _falhou: !!o.falhou, _erro: o.erro || null
    });
  });
}

// Rola a conversa pro fim (mensagem mais recente) — chamado ao abrir um
// grupo, ao mandar mensagem, e quando o teclado abre (foco no campo de
// digitar), pra nunca ficar mostrando área em branco tipo a tela ficando
// "presa" no meio quando o teclado empurra o layout.
function rolarThreadParaBaixo() {
  requestAnimationFrame(function () {
    var alvo = document.body.scrollHeight;
    window.scrollTo(0, alvo);
    var scrollInterno = document.querySelector('.scroll');
    if (scrollInterno) scrollInterno.scrollTop = scrollInterno.scrollHeight;
  });
}

async function loadThread(grupo) {
  if (state.activeGroupId !== grupo.id) state.threadMembersExpanded = false;
  state.activeGroupId = grupo.id; state.activeGroupMeta = grupo;
  state.screen = 'thread'; state.composeError = '';
  clearInterval(composeCooldownTimer); state.composeCooldownRestante = 0; state.composeCooldownOk = false;
  marcarGrupoComoVisto(grupo.id);

  // mostra o que já tem salvo desse grupo na hora — só limpa/mostra "vazio"
  // se realmente não tiver nada em cache ainda (primeira vez abrindo)
  var cacheMsgs = lsGet('thread:' + grupo.id, null);
  state.threadMessages = cacheMsgs ? cacheMsgs.slice() : [];
  state.threadMembers = lsGet('threadMembers:' + grupo.id, []);
  mesclarPendentesNaThread(grupo.id);
  render();
  rolarThreadParaBaixo();

  var msgsPromise = sb.from('mensagens').select('id, texto, criado_em, fixado, removida_em, autor_id, eh_informe, exige_confirmacao').eq('grupo_id', grupo.id).order('criado_em', { ascending: false }).limit(60);
  var membersPromise = state.perfil.is_moderador
    ? sb.from('memberships').select('perfil_id, papel, pode_postar, perfis(nome_completo, funcao)').eq('grupo_id', grupo.id)
    : Promise.resolve({ data: [] });
  var [msgsRes, membersRes] = await Promise.all([msgsPromise, membersPromise]);
  if (msgsRes.error) { if (!cacheMsgs) state.banner = msgsRes.error.message; render(); return; } // sem rede: fica só no que já tinha
  var msgs = msgsRes.data || [];
  var autorIds = Array.from(new Set(msgs.map(function (m) { return m.autor_id; })));
  var autorMap = {};
  if (autorIds.length) {
    var { data: autores } = await sb.from('perfis').select('id, nome_completo, nome_exibicao, is_moderador').in('id', autorIds);
    (autores || []).forEach(function (a) { autorMap[a.id] = a; });
  }
  msgs.forEach(function (m) { m._autor = autorMap[m.autor_id] || { nome_completo: 'Integrante' }; });
  msgs.reverse(); // veio do banco mais nova primeiro (pro LIMIT pegar as 60 mais recentes) — pra exibir, ordem cronológica (mais antiga em cima), igual WhatsApp
  lsSet('thread:' + grupo.id, msgs);
  state.threadMessages = msgs;
  mesclarPendentesNaThread(grupo.id);
  state.threadMembers = (membersRes.data || []).map(function (row) {
    return { perfilId: row.perfil_id, name: row.perfis ? row.perfis.nome_completo : '—', role: row.perfis ? row.perfis.funcao : row.papel };
  });
  if (state.perfil.is_moderador) lsSet('threadMembers:' + grupo.id, state.threadMembers);
  var minhaMembership = (membersRes.data || []).filter(function (row) { return row.perfil_id === state.session.user.id; })[0];
  state.souMembroComPostagem = !!(minhaMembership && minhaMembership.pode_postar);
  var idsQueExigem = msgs.filter(function (m) { return m.exige_confirmacao; }).map(function (m) { return m.id; });
  if (idsQueExigem.length) {
    var { data: conf } = await sb.from('mensagens_confirmacoes').select('mensagem_id').eq('perfil_id', state.session.user.id).in('mensagem_id', idsQueExigem);
    state.minhasConfirmacoesMensagens = (conf || []).map(function (c) { return c.mensagem_id; });
  } else { state.minhasConfirmacoesMensagens = []; }
  render();
  rolarThreadParaBaixo();
  subscribeThread(grupo.id);
}

function subscribeThread(grupoId) {
  if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; }
  threadChannel = sb.channel('thread-' + grupoId).on('postgres_changes', { event: '*', schema: 'public', table: 'mensagens', filter: 'grupo_id=eq.' + grupoId }, function () {
    if (state.activeGroupId === grupoId) loadThread(state.activeGroupMeta);
  }).subscribe();
}

function leaveThread() {
  if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; }
  state.activeGroupId = null; state.activeGroupMeta = null;
}

// Leitura é liberada na hora só com a identidade; postar (mensagem, mural,
// confirmação) exige confirmar o código de verificação — enquanto isso não
// acontecer, qualquer ação de escrita manda a pessoa pra aba Perfil, onde
// fica o campo de confirmar o código.
function exigeVerificacao() {
  if (state.perfil.email_verificado) return false;
  go('perfil');
  state.banner = 'Confirme o código de verificação (mandamos por e-mail) pra poder postar.';
  render();
  return true;
}

var composeCooldownTimer = null;
function iniciarContagemRegressivaEnvio(segundos) {
  clearInterval(composeCooldownTimer);
  state.composeCooldownRestante = segundos;
  state.composeCooldownOk = false;
  composeCooldownTimer = setInterval(function () {
    state.composeCooldownRestante--;
    if (state.composeCooldownRestante <= 0) {
      clearInterval(composeCooldownTimer);
      state.composeCooldownRestante = 0;
      state.composeCooldownOk = true;
    }
    render();
  }, 1000);
  render();
}

// Enfileira uma mensagem/informe pra envio — aparece na tela IMEDIATAMENTE
// (otimista) e é processada em seguida (na hora, se tiver rede; guardada e
// tentada de novo quando a conexão voltar, se não tiver).
function enfileirarMensagem(grupoId, texto, ehInforme, exigeConfirmacao) {
  var item = {
    tempId: 'tmp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    tipo: 'mensagem', grupoId: grupoId, texto: texto, ehInforme: !!ehInforme, exigeConfirmacao: !!exigeConfirmacao,
    criado_em: new Date().toISOString()
  };
  state.outbox.push(item);
  lsSet('outbox', state.outbox);
  if (grupoId === state.activeGroupId) { mesclarPendentesNaThread(grupoId); render(); rolarThreadParaBaixo(); } else { render(); }
  processarItemOutbox(item);
}

var COLUNAS_MENSAGEM = 'id, texto, criado_em, fixado, removida_em, autor_id, eh_informe, exige_confirmacao';

// Troca a entrada otimista (tempId) pela linha de verdade — tanto no cache
// local do grupo quanto (se for o grupo aberto agora) na tela. Compartilhado
// pelos dois jeitos de "sucesso": inseriu agora, ou já tinha inserido antes
// (recuperado pelo cliente_id — ver processarItemOutbox).
function confirmarMensagemNaThread(item, linhaReal) {
  linhaReal._autor = state.perfil;
  var cacheAtual = lsGet('thread:' + item.grupoId, []);
  if (!cacheAtual.some(function (m) { return m.id === linhaReal.id; })) cacheAtual.push(linhaReal); // fim = mais nova, ordem cronológica
  lsSet('thread:' + item.grupoId, cacheAtual);

  if (item.grupoId === state.activeGroupId) {
    var idx = state.threadMessages.findIndex(function (x) { return x.id === item.tempId || x.id === linhaReal.id; });
    if (idx !== -1) state.threadMessages[idx] = linhaReal; else state.threadMessages.push(linhaReal);
  }
  render();
}

async function processarItemOutbox(item) {
  // trava contra processar o mesmo item 2x — o navegador pode disparar
  // 'online' mais de uma vez seguida (nativo + qualquer coisa que também
  // escute o evento), e enfileirarMensagem já chama isso na hora também.
  if (item._emProcessamento) return;
  item._emProcessamento = true;
  if (!navigator.onLine) { item._emProcessamento = false; return; } // fica na fila — flushOutbox tenta de novo quando o evento 'online' disparar
  var { data, error } = await sb.from('mensagens').insert({
    grupo_id: item.grupoId, autor_id: state.session.user.id, texto: item.texto,
    eh_informe: item.ehInforme, exige_confirmacao: item.exigeConfirmacao, cliente_id: item.tempId
  }).select(COLUNAS_MENSAGEM).single();

  // Reenvio do MESMO item (ex.: a resposta do primeiro envio se perdeu — app
  // fechado, rede caiu — e ele ficou na fila local achando que não tinha
  // ido): o índice único de (autor_id, cliente_id) recusa a segunda linha.
  // Não é erro de verdade — já foi enviada, só busca a linha que já existe
  // em vez de reportar falha (e, principalmente, em vez de inserir de novo).
  if (error && error.code === '23505') {
    var recuperada = await sb.from('mensagens').select(COLUNAS_MENSAGEM).eq('autor_id', state.session.user.id).eq('cliente_id', item.tempId).maybeSingle();
    if (recuperada.data) { data = recuperada.data; error = null; }
  }

  if (error) {
    // recusa do servidor (flood, sem permissão etc.) — não é problema de rede,
    // tentar de novo sozinho ia falhar igual. Marca a mensagem como não
    // enviada e MANTÉM na fila local (só marcada, sem tentar de novo sozinha)
    // — precisa continuar existindo em algum lugar persistente, senão some
    // sem deixar rastro assim que qualquer coisa recarregar a thread (outra
    // pessoa postando, F5, trocar de tela e voltar).
    item._emProcessamento = false;
    item.falhou = true;
    item.erro = error.message;
    lsSet('outbox', state.outbox);
    if (item.grupoId === state.activeGroupId) mesclarPendentesNaThread(item.grupoId);
    var m = (error.message || '').match(/Espere (\d+) segundos/);
    if (item.grupoId === state.activeGroupId && m && !item.ehInforme) iniciarContagemRegressivaEnvio(parseInt(m[1], 10));
    render();
    return;
  }

  state.outbox = state.outbox.filter(function (o) { return o.tempId !== item.tempId; });
  lsSet('outbox', state.outbox);
  confirmarMensagemNaThread(item, data);
}

function flushOutbox() {
  if (!navigator.onLine || !state.outbox.length) return;
  // nunca reenvia sozinho um item já marcado como recusado — só o próprio
  // usuário tocando "Tentar de novo" reenvia esses (ver retryMensagemFalha)
  state.outbox.slice().filter(function (o) { return !o.falhou; }).forEach(function (item) { processarItemOutbox(item); });
}

function retryMensagemFalha(tempId) {
  if (state.composeCooldownRestante > 0) return; // ia falhar de novo na hora — o aviso de contagem já explica o motivo
  var item = state.outbox.find(function (o) { return o.tempId === tempId; });
  if (!item) return;
  item.falhou = false; item.erro = null;
  lsSet('outbox', state.outbox);
  if (item.grupoId === state.activeGroupId) {
    var idx = state.threadMessages.findIndex(function (m) { return m.id === tempId; });
    if (idx !== -1) { state.threadMessages[idx]._falhou = false; state.threadMessages[idx]._pendente = true; }
  }
  render();
  processarItemOutbox(item);
}
function descartarMensagemFalha(tempId) {
  state.outbox = state.outbox.filter(function (o) { return o.tempId !== tempId; });
  lsSet('outbox', state.outbox);
  var idx = state.threadMessages.findIndex(function (m) { return m.id === tempId; });
  if (idx !== -1) state.threadMessages.splice(idx, 1);
  render();
}

function sendMessage() {
  var texto = state.composeText.trim();
  if (!texto || !state.activeGroupId) return;
  if (exigeVerificacao()) return;
  if (state.composeCooldownRestante > 0) return;
  state.composeError = '';
  state.composeCooldownOk = false;
  state.composeText = '';
  enfileirarMensagem(state.activeGroupId, texto, false, false);
}

function postarInforme() {
  var texto = state.informeFormTexto.trim();
  if (!texto || !state.activeGroupId) { state.banner = 'Escreva o texto do informe.'; render(); return; }
  if (exigeVerificacao()) return;
  var exigeConf = state.informeFormExigeConfirmacao;
  state.showInformeForm = false; state.informeFormTexto = ''; state.informeFormExigeConfirmacao = false;
  enfileirarMensagem(state.activeGroupId, texto, true, exigeConf);
}

async function confirmarLeituraMensagem(id) {
  if (exigeVerificacao()) return;
  var { error } = await sb.from('mensagens_confirmacoes').insert({ mensagem_id: id, perfil_id: state.session.user.id });
  if (error) { state.banner = error.message; render(); return; }
  state.minhasConfirmacoesMensagens.push(id);
  render();
}

async function removeMessage(id) {
  if (!confirm('Remover esta mensagem? Fica registrado no histórico quem removeu, para prestação de contas.')) return;
  await sb.from('mensagens').update({ removida_em: new Date().toISOString(), removida_por: state.session.user.id }).eq('id', id);
  await loadThread(state.activeGroupMeta);
}

function adicionarPasso() {
  state.muralFormPassos.push({ data: '', texto: '' });
  render();
}
function removerPasso(idx) {
  state.muralFormPassos.splice(idx, 1);
  render();
}

async function criarAvisoMural() {
  var titulo = state.muralFormTitulo.trim(), texto = state.muralFormTexto.trim();
  if (!titulo) { state.banner = 'O título do aviso é obrigatório.'; render(); return; }
  if (exigeVerificacao()) return;
  var passos = state.muralFormPassos
    .map(function (p) { return { data: (p.data || '').trim(), texto: (p.texto || '').trim() }; })
    .filter(function (p) { return p.texto; });
  var topicosTitulo = state.muralFormTopicosTitulo.trim();
  if (state.muralFormComTopicos) {
    if (!topicosTitulo) { state.banner = 'Dê um título pra seção de tópicos (é o texto do botão "ver mais").'; render(); return; }
    if (!passos.length) { state.banner = 'Adicione pelo menos 1 tópico, ou desmarque a seção de tópicos.'; render(); return; }
  }
  var audiencia = state.muralFormAudienciaTodos ? ['todos'] : state.muralFormAudiencia.slice();
  if (!state.muralFormAudienciaTodos && !audiencia.length) { state.banner = 'Marque pelo menos um público, ou selecione "Todos".'; render(); return; }
  var campos = { titulo: titulo, texto: texto || null, visibilidade: audiencia, exige_confirmacao: state.muralFormExigeConfirmacao, passos: null, passos_titulo: null };
  if (state.muralFormComTopicos && passos.length) { campos.passos = passos; campos.passos_titulo = topicosTitulo; }
  var error;
  if (state.editingMuralId) {
    var res = await sb.from('mural_posts').update(campos).eq('id', state.editingMuralId);
    error = res.error;
  } else {
    var novo = Object.assign({ autor_id: state.session.user.id, status: 'pendente' }, campos);
    var res2 = await sb.from('mural_posts').insert(novo);
    error = res2.error;
  }
  if (error) { state.banner = error.message; render(); return; }
  state.showMuralForm = false; state.editingMuralId = null; state.muralFormTitulo = ''; state.muralFormTexto = ''; state.muralFormPassos = [];
  state.muralFormComTopicos = false; state.muralFormTopicosTitulo = '';
  state.muralFormAudienciaTodos = true; state.muralFormAudiencia = []; state.muralFormExigeConfirmacao = false;
  await loadMural(); render();
}

function editarAvisoMural(id) {
  var post = state.muralPosts.concat(state.reviewQueue).filter(function (p) { return p.id === id; })[0];
  if (!post) return;
  state.editingMuralId = id;
  state.muralFormTitulo = post.titulo || '';
  state.muralFormTexto = post.texto || '';
  state.muralFormComTopicos = !!(post.passos && post.passos.length);
  state.muralFormTopicosTitulo = post.passos_titulo || '';
  state.muralFormPassos = (post.passos || []).map(function (p) { return { data: p.data || '', texto: p.texto || '' }; });
  var vis = post.visibilidade || ['todos'];
  state.muralFormAudienciaTodos = vis.indexOf('todos') !== -1;
  state.muralFormAudiencia = state.muralFormAudienciaTodos ? [] : vis.slice();
  state.muralFormExigeConfirmacao = !!post.exige_confirmacao;
  state.showMuralForm = true;
  render();
}

async function moverMural(id, direcao) {
  var { error } = await sb.rpc('mural_mover', { p_id: id, p_direcao: direcao });
  if (error) { state.banner = error.message; render(); return; }
  await loadMural(); render();
}

async function verHistoricoMural(id) {
  if (state.expandedHistoricoId === id) { state.expandedHistoricoId = null; render(); return; }
  if (!state.historicoMural[id]) {
    var { data, error } = await sb.from('mural_posts_historico').select('*, perfis(nome_completo)').eq('post_id', id).order('editado_em', { ascending: false });
    state.historicoMural[id] = error ? [] : (data || []);
  }
  state.expandedHistoricoId = id;
  render();
}

function toggleAudiencia(categoria) {
  var idx = state.muralFormAudiencia.indexOf(categoria);
  if (idx === -1) state.muralFormAudiencia.push(categoria); else state.muralFormAudiencia.splice(idx, 1);

// Uma pessoa aparece 1x na lista mesmo pertencendo a vários grupos (Geral +
// Seção + Geral-da-escola, por exemplo) — junta tudo isso num "Local" só.
function agruparPorPessoa(linhas) {
  var porPessoa = {};
  var ordem = [];
  linhas.forEach(function (m) {
    if (!m.perfis) return;
    var id = m.perfil_id;
    if (!porPessoa[id]) {
      porPessoa[id] = { id: id, nome_completo: m.perfis.nome_completo, funcao: m.perfis.funcao, subfuncao: m.perfis.subfuncao, chave_pix: m.perfis.chave_pix, email_verificado: m.perfis.email_verificado, gruposPrimarios: [] };
      ordem.push(id);
    }
    var g = m.grupos;
    if (!g || g.slug === 'geral' || g.tipo === 'escola_geral') return;
    porPessoa[id].gruposPrimarios.push(g);
  });
  return ordem.map(function (id) { return porPessoa[id]; })
    .sort(function (a, b) { return (a.nome_completo || '').localeCompare(b.nome_completo || '', 'pt-BR'); });
}
// A partir dos grupos "primários" de uma pessoa, reconstrói o Local (tipo +
// escola/seção) pra pré-preencher o formulário de edição.
function localDaPessoa(pessoa) {
  var g = pessoa.gruposPrimarios[0];
  if (!g) return { tipo: 'tre', escola: '', secao: '' };
  if (g.slug === 'operadores') return { tipo: 'operadores', escola: '', secao: '' };
  if (g.tipo === 'secao') {
    var escolaGrupo = state.allGroups.find(function (x) { return x.id === g.escola_id; });
    return { tipo: 'secao', escola: escolaGrupo ? escolaGrupo.nome : '', secao: numeroDoSlugSecao(g.slug) };
  }
  if (g.tipo === 'escola') return { tipo: 'escola', escola: g.nome, secao: '' };
  return { tipo: 'tre', escola: '', secao: '' };
}
function localTexto(pessoa) {
  if (!pessoa.gruposPrimarios.length) return 'TRE';
  return pessoa.gruposPrimarios.map(function (g) { return g.nome; }).join(' + ');
}

// ---------- Importação em massa (CSV/JSON) ----------
// Colunas esperadas (CSV com cabeçalho, separador , ou ;): email, nome_completo,
// funcao, cpf, titulo, data_nascimento, local (tre | operadores | escola |
// secao), escola (nome — obrigatório se local=escola/secao), secao (número —
// obrigatório se local=secao). JSON: mesma coisa, array de objetos.
function parseCsvLinha(linha, sep) {
  var campos = [], atual = '', dentroAspas = false;
  for (var i = 0; i < linha.length; i++) {
    var c = linha[i];
    if (c === '"') { dentroAspas = !dentroAspas; continue; }
    if (c === sep && !dentroAspas) { campos.push(atual); atual = ''; continue; }
    atual += c;
  }
  campos.push(atual);
  return campos.map(function (c) { return c.trim(); });
}
function parseImportacao(texto) {
  texto = (texto || '').trim();
  if (!texto) return [];
  if (texto[0] === '[' || texto[0] === '{') {
    var json = JSON.parse(texto);
    var arr = Array.isArray(json) ? json : [json];
    return arr.map(function (l) {
      return { email: l.email, nome_completo: l.nome_completo, funcao: l.funcao || '', subfuncao: l.subfuncao || '', cpf: l.cpf, titulo: l.titulo, data_nascimento: l.data_nascimento, local_tipo: localTipoDaFuncao(l.funcao || ''), escola: l.escola || '', secao: l.secao || '' };
    });
  }
  var linhas = texto.split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (!linhas.length) return [];
  var sep = linhas[0].indexOf(';') !== -1 ? ';' : ',';
  var cabecalho = parseCsvLinha(linhas[0], sep).map(function (c) { return c.toLowerCase(); });
  return linhas.slice(1).map(function (linha) {
    var campos = parseCsvLinha(linha, sep);
    var obj = {};
    cabecalho.forEach(function (nomeCol, i) { obj[nomeCol] = campos[i] || ''; });
    return { email: obj.email, nome_completo: obj.nome_completo, funcao: obj.funcao || '', subfuncao: obj.subfuncao || '', cpf: obj.cpf, titulo: obj.titulo, data_nascimento: obj.data_nascimento, local_tipo: localTipoDaFuncao(obj.funcao || ''), escola: obj.escola || '', secao: obj.secao || '' };
  });
}

    '<div class="login-sub">Confirme os dados já cadastrados na sua convocação junto ao TRE-PE. Sem senha — se os dados baterem, seu acesso de leitura é liberado na hora (Mural, grupos, tudo). Pra poder postar, mandamos separadamente um código de verificação pro seu e-mail, que você confirma na aba Perfil quando quiser.</div>' +
    '<div class="login-form">' +
    '<input type="text" id="login-nome-input" placeholder="Nome completo" value="' + esc(state.loginNome) + '">' +
    '<input type="text" inputmode="numeric" id="login-cpf-input" placeholder="CPF" value="' + esc(state.loginCpf) + '">' +
    '<input type="text" inputmode="numeric" id="login-titulo-input" placeholder="Título de eleitor" value="' + esc(state.loginTitulo) + '">' +
    '<input type="text" id="login-nascimento-input" placeholder="Data de nascimento (dd/mm/aaaa)" value="' + esc(state.loginNascimento) + '">' +
    '<label class="consent-row"><input type="checkbox" id="login-aceite-checkbox"' + (state.loginAceite ? ' checked' : '') + '>' +
    '<span>Li e aceito que meus dados (nome, CPF, título de eleitor, data de nascimento e e-mail) sejam usados para confirmar minha identidade e liberar meu acesso a este aplicativo experimental de comunicação da 4ª Zona Eleitoral, até sua desativação e a exclusão dos meus dados pessoais (prevista para até 15 dias após o fim do pleito).</span></label>' +
    '<button class="login-btn" data-action="solicitar-codigo" ' + (state.loginSending || !state.loginAceite ? 'disabled' : '') + '>' + (state.loginSending ? 'Verificando…' : 'Entrar') + '</button>' +
    '</div>' + statusHtml +
    '<button class="link-btn" style="margin-top:18px; color:#9B9484; font-size:12px;" data-action="encerrar-sessao-forcado">Encerrar sessão / limpar dados salvos neste aparelho</button>' +
    '</div>';
}

function renderPassosBloco(post) {
  if (!post.passos || !post.passos.length) return '';
  var expandido = state.expandedMuralId === post.id;
  var rotulo = post.passos_titulo || 'lista completa';
  var html = '<button class="link-btn" data-action="toggle-mural-expand" data-id="' + post.id + '">' +
    (expandido ? 'Ocultar ' + esc(rotulo) : 'Ver ' + esc(rotulo)) +
    '<span style="display:flex; transform:' + (expandido ? 'rotate(180deg)' : 'rotate(0deg)') + ';">' + icon('chev', 13) + '</span></button>';
  if (expandido) {
    html += '<div class="steps">';
    post.passos.forEach(function (s) { html += '<div class="step"><span class="step-date">' + esc(s.data || '') + '</span><span class="step-text">' + esc(s.texto) + '</span></div>'; });
    html += '</div>';
  }
  return html;
}

function renderMural() {
  var html = '<div class="eyebrow">Mural de comunicação</div>';
  if (state.reviewQueue.length) {
    html += '<div class="review-box"><div class="review-title">Fila de revisão (' + state.reviewQueue.length + ')</div>';
    state.reviewQueue.forEach(function (p) {
      var podeAprovar = state.perfil.is_revisor;
      html += '<div class="review-item"><div class="post-author">' + esc(p._autorNome) + '</div><div style="font-size:13px; font-weight:700; color:#16294B; margin-bottom:4px;">' + esc(p.titulo) + '</div>' +
        '<div class="audience-badge" style="margin-top:0; margin-bottom:8px;">' + esc(rotuloVisibilidade(p.visibilidade)) + (p.exige_confirmacao ? ' · exige confirmação' : '') + '</div>' +
        (p.texto ? '<div class="post-text">' + esc(p.texto) + '</div>' : '');
      if (p.passos && p.passos.length) {
        if (p.passos_titulo) html += '<div class="faq-cat-tag" style="margin-top:8px;">' + esc(p.passos_titulo) + '</div>';
        html += '<div class="steps">';
        p.passos.forEach(function (s) { html += '<div class="step"><span class="step-date">' + esc(s.data || '') + '</span><span class="step-text">' + esc(s.texto) + '</span></div>'; });
        html += '</div>';
      }
      if (podeAprovar) {
        html += '<div class="review-actions"><button class="btn-approve" data-action="aprovar-mural" data-id="' + p.id + '">Aprovar e publicar</button><button class="btn-reject" data-action="rejeitar-mural" data-id="' + p.id + '">Rejeitar</button></div>';
      } else {
        html += '<div class="hint" style="margin-top:8px;">Aguardando revisão do desenvolvedor antes de publicar.</div>';
      }
      if (state.perfil.is_moderador) {
        html += '<div style="display:flex; gap:6px; margin-top:6px;">' +
          '<button class="link-btn" style="margin-top:0;" data-action="editar-mural" data-id="' + p.id + '">' + icon('plus', 13) + ' Editar</button>' +
          '<button class="link-btn" style="margin-top:0; color:#A24B3E;" data-action="remover-mural" data-id="' + p.id + '">' + icon('x', 13) + ' Remover</button>' +
          '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  if (state.perfil.is_moderador) {
    if (state.showMuralForm) {
      html += '<div class="add-form"><div class="add-form-title">' + (state.editingMuralId ? 'Editar aviso do Mural' : 'Novo aviso no Mural') + '</div>' +
        (state.editingMuralId ? '<div class="hint" style="margin:0 2px 8px; color:#A24B3E;">Se este aviso já estiver publicado, a edição volta ele pra fila de revisão antes de aparecer atualizado no Mural.</div>' : '') +
        '<div class="hint" style="margin:0 2px 8px;">O cabeçalho "Cartório Eleitoral · 4ª Zona" já aparece sozinho em cima de todo aviso — não precisa digitar isso. O título é a manchete do aviso, ex.: "Fechamento dos portões às 17h".</div>' +
        '<input type="text" id="mural-titulo-input" placeholder="Título (obrigatório) — ex.: Fechamento dos portões às 17h" value="' + esc(state.muralFormTitulo) + '">' +
        '<textarea id="mural-texto-input" placeholder="Texto do aviso (opcional)" rows="3" style="width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:13px; margin-bottom:8px; font-family:inherit; resize:vertical;">' + esc(state.muralFormTexto) + '</textarea>';
      html += '<div class="toggle-row" style="margin-bottom:' + (state.muralFormComTopicos ? '12px' : '4px') + ';"><div>' +
        '<div class="toggle-title" style="font-size:12.5px;">Seção de tópicos</div>' +
        '<div class="toggle-desc">Opcional — ex.: cronograma com data + descrição, aparece com "ver mais"</div></div>' +
        '<button class="switch" style="background:' + (state.muralFormComTopicos ? '#16294B' : '#D8D2C4') + ';" data-action="toggle-topicos"><div class="switch-knob" style="left:' + (state.muralFormComTopicos ? '21px' : '3px') + ';"></div></button></div>';
      if (state.muralFormComTopicos) {
        html += '<input type="text" id="mural-topicos-titulo-input" placeholder="Título da seção (ex.: Cronograma completo)" value="' + esc(state.muralFormTopicosTitulo) + '" style="margin-bottom:8px;">';
        state.muralFormPassos.forEach(function (p, idx) {
          html += '<div style="display:flex; gap:6px; margin-bottom:8px;">' +
            '<input type="text" data-passo-campo="data" data-passo-idx="' + idx + '" placeholder="Data/rótulo" style="width:100px; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px;" value="' + esc(p.data) + '">' +
            '<input type="text" data-passo-campo="texto" data-passo-idx="' + idx + '" placeholder="Descrição do tópico" style="flex:1 1 auto; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px;" value="' + esc(p.texto) + '">' +
            '<button data-action="remover-passo" data-idx="' + idx + '" style="background:#F7F0E8; border:none; border-radius:7px; width:36px; flex:0 0 auto; color:#A24B3E;">' + icon('x', 14) + '</button>' +
            '</div>';
        });
        html += '<button class="link-btn" data-action="adicionar-passo" style="margin-bottom:12px;">' + icon('plus', 14) + ' Adicionar tópico (pelo menos 1)</button>';
      }
      html += '<div class="hint" style="margin:4px 2px 6px;">Quem pode ver este aviso:</div>';
      html += '<div class="filter-row" style="margin-bottom:' + (state.muralFormAudienciaTodos ? '12px' : '8px') + ';">' +
        '<button class="filter-chip' + (state.muralFormAudienciaTodos ? ' active' : '') + '" data-action="audiencia-todos">Todos</button>' +
        '<button class="filter-chip' + (!state.muralFormAudienciaTodos ? ' active' : '') + '" data-action="audiencia-mescla">Grupos específicos</button>' +
        '</div>';
      if (!state.muralFormAudienciaTodos) {
        html += '<div class="filter-row" style="margin-bottom:12px;">';
        ['administradores', 'operadores', 'mesarios'].forEach(function (cat) {
          var marcado = state.muralFormAudiencia.indexOf(cat) !== -1;
          html += '<button class="filter-chip' + (marcado ? ' active' : '') + '" data-action="toggle-audiencia" data-cat="' + cat + '">' + (marcado ? '✓ ' : '') + ROTULO_AUDIENCIA[cat] + '</button>';
        });
        html += '</div>';
      }
      html += '<div class="toggle-row" style="margin-bottom:12px;"><div>' +
        '<div class="toggle-title" style="font-size:12.5px;">Exigir confirmação de leitura</div>' +
        '<div class="toggle-desc">Quem for do público-alvo vê um botão "Confirmar leitura" e um aviso até confirmar</div></div>' +
        '<button class="switch" style="background:' + (state.muralFormExigeConfirmacao ? '#16294B' : '#D8D2C4') + ';" data-action="toggle-exige-confirmacao"><div class="switch-knob" style="left:' + (state.muralFormExigeConfirmacao ? '21px' : '3px') + ';"></div></button></div>';
      html += '<div class="add-form-actions"><button class="btn-primary" data-action="enviar-mural">' + (state.editingMuralId ? 'Salvar edição' : 'Enviar para revisão') + '</button><button class="btn-secondary" data-action="cancelar-mural">Cancelar</button></div></div>';
    } else {
      html += '<button class="add-dashed" data-action="abrir-form-mural">' + icon('plus', 15) + ' Novo aviso no Mural</button>';
    }
  }
  state.muralPosts.forEach(function (post, idx) {
    html += '<div class="card"><div class="pin-row"><div class="pin-tag">';
    if (post.fixado) html += icon('pin', 13, 'none', '#C79A3D') + '<span class="pin-label">Fixado</span>';
    html += '</div><span class="post-time">' + esc(fmtHora(post.criado_em)) + '</span></div>' +
      '<div class="post-author">Cartório Eleitoral · 4ª Zona</div>' +
      '<div style="font-size:13.5px; font-weight:700; color:#16294B; margin-bottom:4px;">' + esc(post.titulo) + '</div>' +
      '<div class="audience-badge" style="margin-top:0; margin-bottom:8px;">' + esc(rotuloVisibilidade(post.visibilidade)) + '</div>' +
      (post.texto ? '<div class="post-text">' + esc(post.texto) + '</div>' : '');
    html += renderPassosBloco(post);
    if (post.exige_confirmacao) {
      var confirmado = state.minhasConfirmacoes.indexOf(post.id) !== -1;
      if (confirmado) {
        html += '<div style="display:flex; align-items:center; gap:6px; color:#3E6E4E; font-weight:700; font-size:13px; margin-top:10px;">' + icon('check', 18, '#3E6E4E') + ' Leitura confirmada</div>';
      } else {
        html += '<button class="btn-approve" style="margin-top:10px; width:100%;" data-action="confirmar-leitura" data-id="' + post.id + '">Confirmar leitura</button>';
      }
    }
    if (state.perfil.is_moderador) {
      var mesmoBloco = state.muralPosts.filter(function (p) { return p.fixado === post.fixado; });
      var posNoBloco = mesmoBloco.indexOf(post);
      html += '<div class="mod-toolbar" style="display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">' +
        '<button class="icon-btn" title="Mover pra cima" data-action="mover-mural-cima" data-id="' + post.id + '"' + (posNoBloco === 0 ? ' disabled' : '') + '>' + icon('arrowUp', 14) + '</button>' +
        '<button class="icon-btn" title="Mover pra baixo" data-action="mover-mural-baixo" data-id="' + post.id + '"' + (posNoBloco === mesmoBloco.length - 1 ? ' disabled' : '') + '>' + icon('chev', 14) + '</button>' +
        '<button class="link-btn" data-action="editar-mural" data-id="' + post.id + '">' + icon('edit', 13) + ' Editar</button>' +
        '<button class="link-btn" data-action="ver-historico-mural" data-id="' + post.id + '">' + icon('clock', 13) + ' Histórico</button>' +
        '<button class="link-btn" style="color:#A24B3E;" data-action="remover-mural" data-id="' + post.id + '">' + icon('x', 13) + ' Remover</button>' +
        '</div>';
      if (state.expandedHistoricoId === post.id) html += renderHistoricoMural(post.id);
    }
    html += '</div>';
  });
  if (!state.muralPosts.length && !state.reviewQueue.length) html += '<div class="hint">Nenhum aviso publicado ainda.</div>';
  return html;
}

function groupCardHtml(g, opts) {
  opts = opts || {};
  var st = iconStyleFor(g);
  var nome = opts.rotulo || g.nome;
  var naoLida = state.gruposNaoLidos.indexOf(g.id) !== -1;
  return '<button class="group-card' + (opts.sub ? ' group-card-sub' : '') + '" data-action="open-group" data-group="' + g.id + '">' +
    '<div class="group-icon" style="background:' + st.bg + '; position:relative;">' + icon(st.icon, 19, '#F7F5F0') +
    (naoLida ? '<span style="position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:#C79A3D; border:2px solid #fff;"></span>' : '') +
    '</div>' +
    '<div style="flex:1 1 auto; min-width:0;"><div class="group-name" style="' + (naoLida ? 'font-weight:700;' : '') + '">' + esc(nome) + '</div><div class="group-sub">' + esc(g.descricao || '') + '</div></div>' +
    icon('chevRight', 15, '#C6BFAE') + '</button>';
}

function renderGruposModerador() {
  var html = '';
  var bySlug = {};
  state.myGroups.forEach(function (g) { bySlug[g.slug] = g; });
  ['geral', 'operadores', 'administradores'].forEach(function (slug) {
    if (bySlug[slug]) html += groupCardHtml(bySlug[slug]);
  });
  var escolas = state.myGroups.filter(function (g) { return g.tipo === 'escola'; })
    .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
  escolas.forEach(function (esc1) {
    var aberta = state.expandedEscolaId === esc1.id;
    var geralDaEscola = state.myGroups.filter(function (g) { return g.tipo === 'escola_geral' && g.escola_id === esc1.id; })[0];
    var secoes = state.myGroups.filter(function (g) { return g.tipo === 'secao' && g.escola_id === esc1.id; })
      .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
    var idsDaPasta = [esc1.id].concat(geralDaEscola ? [geralDaEscola.id] : []).concat(secoes.map(function (s) { return s.id; }));
    var pastaTemNaoLida = idsDaPasta.some(function (id) { return state.gruposNaoLidos.indexOf(id) !== -1; });
    html += '<button class="group-card group-card-folder" data-action="toggle-escola" data-id="' + esc1.id + '">' +
      '<div class="group-icon" style="background:' + iconStyleFor(esc1).bg + '; position:relative;">' + icon('school', 19, '#F7F5F0') +
      (pastaTemNaoLida ? '<span style="position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:#C79A3D; border:2px solid #fff;"></span>' : '') +
      '</div>' +
      '<div style="flex:1 1 auto; min-width:0;"><div class="group-name" style="' + (pastaTemNaoLida ? 'font-weight:700;' : '') + '">' + esc(esc1.nome) + '</div></div>' +
      icon(aberta ? 'arrowUp' : 'chev', 15, '#C6BFAE') + '</button>';
    if (aberta) {
      html += '<div class="group-subgroup">';
      if (geralDaEscola) html += groupCardHtml(geralDaEscola, { sub: true });
      html += groupCardHtml(esc1, { sub: true, rotulo: 'Administradores' });
      secoes.forEach(function (s) { html += groupCardHtml(s, { sub: true }); });
      html += '</div>';
    }
  });
  return html;
}

function renderGrupos() {
  var html = '<div class="eyebrow">Meus grupos</div>';
  if (state.perfil.is_moderador) {
    html += renderGruposModerador();
  } else {
    var ordenados = state.myGroups.slice().sort(function (a, b) {
      if (a.slug === 'geral') return -1;
      if (b.slug === 'geral') return 1;
      return 0;
    });
    ordenados.forEach(function (g) { html += groupCardHtml(g); });
  }
  if (!state.myGroups.length) html += '<div class="hint">Você ainda não está em nenhum grupo. Fale com o Cartório Eleitoral.</div>';
  else html += '<div class="hint">Você faz parte destes grupos conforme sua convocação no TRE-PE.</div>';
  return html;
}

function renderStatusPendenteFalhou(m) {
  if (m._pendente) {
    var texto = navigator.onLine ? 'Enviando…' : 'Na fila — sem conexão, envia sozinho quando voltar';
    return '<div style="display:flex; align-items:center; gap:4px; margin-top:4px; font-size:10.5px; color:#9B9484;">' + icon('clock', 11, '#9B9484') + esc(texto) + '</div>';
  }
  if (m._falhou) {
    var erroLegivel = /^(Espere \d+ segundos|Limite de mensagens atingido)/.test(m._erro || '') ? m._erro : 'não foi possível enviar, tente de novo';
    return '<div style="margin-top:4px;">' +
      '<div style="font-size:11px; color:#A24B3E; font-weight:600;">Não enviada — ' + esc(erroLegivel) + '</div>' +
      '<div style="display:flex; gap:10px; margin-top:2px;">' +
      '<button class="link-btn" style="margin:0; font-size:11px;" data-action="retry-mensagem" data-tempid="' + esc(m.id) + '">Tentar de novo</button>' +
      '<button class="link-btn" style="margin:0; font-size:11px; color:#9B9484;" data-action="descartar-mensagem" data-tempid="' + esc(m.id) + '">Descartar</button>' +
      '</div></div>';
  }
  return '';
}

function renderThread() {
  var html = '';
  if (state.threadMembers.length) {
    html += '<div class="members-box">' +
      '<button class="link-btn" style="margin:0; width:100%; justify-content:space-between;" data-action="toggle-membros-thread">' +
      '<span class="eyebrow" style="margin:0;">Integrantes (' + state.threadMembers.length + ')</span>' +
      '<span style="display:flex; transform:' + (state.threadMembersExpanded ? 'rotate(180deg)' : 'rotate(0deg)') + ';">' + icon('chev', 14, '#8A8271') + '</span>' +
      '</button>';
    if (state.threadMembersExpanded) {
      html += '<div style="margin-top:8px;">';
      state.threadMembers.forEach(function (m, i) {
        var canRemove = state.perfil.is_moderador && m.perfilId !== state.session.user.id;
        html += '<div class="member-row"><div class="avatar" style="background:' + AVATAR_COLORS[i % AVATAR_COLORS.length] + ';">' + initials(m.name) + '</div>' +
          '<div style="flex:1 1 auto; min-width:0;"><div class="member-name">' + esc(m.name) + '</div><div class="member-role">' + esc(m.role || '') + '</div></div>' +
          (canRemove ? '<button class="remove-btn" title="Tirar deste grupo" data-action="remove-do-grupo" data-id="' + m.perfilId + '" data-grupo="' + state.activeGroupId + '">' + icon('x', 13) + '</button>' : '') +
          '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  var prevAuthor = null;
  state.threadMessages.forEach(function (m) {
    var souEu = m._autor.id === state.session.user.id;
    var authorName = nomeExibir(m._autor);
    var sameAsPrev = m.autor_id === prevAuthor && !m.eh_informe;
    var authorColor = m._autor.is_moderador ? '#C79A3D' : '#16294B';

    if (m.eh_informe) {
      html += '<div class="message-card message-informe"><div class="pin-tag" style="margin-bottom:4px;">' + icon('pin', 12, 'none', '#C79A3D') + '<span class="pin-label">Informe do Cartório</span>' +
        '<span style="font-size:10.5px; color:#9B9484; font-weight:400; margin-left:auto;">' + esc(fmtHora(m.criado_em)) + '</span></div>';
      if (m.removida_em) {
        html += '<div class="msg-removed">Mensagem removida pela moderação.</div>';
      } else {
        html += '<div class="post-text">' + esc(m.texto) + '</div>';
        html += renderStatusPendenteFalhou(m);
        if (state.perfil.is_moderador && !m._pendente && !m._falhou) html += '<button class="del-msg-btn" data-action="remove-message" data-id="' + m.id + '">' + icon('x', 12) + '</button>';
        if (m.exige_confirmacao && !m._pendente && !m._falhou) {
          var confirmadoInf = state.minhasConfirmacoesMensagens.indexOf(m.id) !== -1;
          html += confirmadoInf
            ? '<div style="display:flex; align-items:center; gap:6px; color:#3E6E4E; font-weight:700; font-size:13px; margin-top:8px;">' + icon('check', 18, '#3E6E4E') + ' Leitura confirmada</div>'
            : '<button class="btn-approve" style="margin-top:8px; width:100%;" data-action="confirmar-leitura-mensagem" data-id="' + m.id + '">Confirmar leitura</button>';
        }
      }
      html += '</div>';
      prevAuthor = m.autor_id;
      return;
    }

    html += '<div class="msg-row ' + (souEu ? 'own' : 'other') + '">' +
      '<div class="msg-bubble ' + (souEu ? 'own' : 'other') + (sameAsPrev ? '' : ' first') + '">';
    if (!sameAsPrev && !souEu) html += '<div class="msg-author-label" style="color:' + authorColor + ';">' + esc(authorName) + '</div>';
    if (m.removida_em) {
      html += '<div class="msg-removed">Mensagem removida pela moderação.</div>';
    } else {
      html += '<div class="msg-text">' + esc(m.texto) +
        '<span class="msg-meta">' + (m.fixado ? icon('pin', 11, 'none', '#C79A3D') : '') + '<span class="msg-time">' + esc(fmtHora(m.criado_em)) + '</span></span>' +
        '<span style="clear:both; display:block;"></span></div>';
      html += renderStatusPendenteFalhou(m);
      if (state.perfil.is_moderador && !m._pendente && !m._falhou) html += '<button class="del-msg-btn" data-action="remove-message" data-id="' + m.id + '">' + icon('x', 12) + '</button>';
      if (m.exige_confirmacao && !m._pendente && !m._falhou) {
        var confirmado = state.minhasConfirmacoesMensagens.indexOf(m.id) !== -1;
        html += confirmado

// Quando a sessão morreu de verdade no servidor (token revogado, ex.: reuso
// de refresh token detectado entre abas) não adianta mostrar erro na tela de
// Perfil — a pessoa fica presa lá sem entender. Desloga e manda pra tela de
// login já com um aviso claro.
async function sessaoMorreuVoltarParaLogin() {
  await logout();
  state.screen = 'login';
  state.loginStatus = 'error:Sua sessão expirou (às vezes acontece ao abrir o mesmo link em mais de um lugar). Entre de novo com seus dados.';
  render();
}

async function confirmarVerificacaoEmail() {
  var codigo = state.verifCodigo.trim();
  if (!codigo) return;
  state.verifSending = true; state.verifStatus = ''; render();
  try {
    var { data: sessionData1 } = await sb.auth.getSession();
    if (!sessionData1.session) { state.verifSending = false; await sessaoMorreuVoltarParaLogin(); return; }
    var resp = await fetch(SUPABASE_URL + '/functions/v1/confirmar-verificacao', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionData1.session.access_token },
      body: JSON.stringify({ codigo: codigo })
    });
    if (resp.status === 401) { state.verifSending = false; await sessaoMorreuVoltarParaLogin(); return; }
    var json = await resp.json();
    state.verifSending = false;
    if (!resp.ok) { state.verifStatus = 'error:' + (json.error || 'Código inválido.'); render(); return; }
    state.perfil.email_verificado = true;
    state.verifCodigo = ''; state.verifStatus = 'ok:E-mail confirmado! Já pode postar.';
    render();
  } catch (e) {
    state.verifSending = false; state.verifStatus = 'error:Sem conexão. Tente de novo.'; render();
  }
}

async function pedirNovoCodigoVerificacao() {
  state.verifSending = true; state.verifStatus = ''; render();
  try {
    var { data: sessionData2 } = await sb.auth.getSession();
    if (!sessionData2.session) { state.verifSending = false; await sessaoMorreuVoltarParaLogin(); return; }
    var resp = await fetch(SUPABASE_URL + '/functions/v1/confirmar-verificacao', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionData2.session.access_token },
      body: JSON.stringify({ reenviar: true })
    });
    if (resp.status === 401) { state.verifSending = false; await sessaoMorreuVoltarParaLogin(); return; }
    var json = await resp.json();
    state.verifSending = false;
    if (!resp.ok) { state.verifStatus = 'error:' + (json.error || 'Não foi possível reenviar agora.'); render(); return; }
    state.verifStatus = 'ok:Novo código enviado pra ' + (json.email_mascarado || 'seu e-mail') + '.';
    render();
  } catch (e) {
    state.verifSending = false; state.verifStatus = 'error:Sem conexão. Tente de novo.'; render();
  }
}

function renderFuncaoCampo(prefix, funcaoVal) {
  return '<select id="' + prefix + '-funcao-select">' +
    '<option value=""' + (!funcaoVal ? ' selected' : '') + ' disabled>Selecione a função…</option>' +
    FUNCOES_TRE.map(function (f) { return '<option value="' + esc(f) + '"' + (funcaoVal === f ? ' selected' : '') + '>' + esc(f) + '</option>'; }).join('') +
    '</select>';
}
function renderSubfuncaoCampo(prefix, funcaoVal, subfuncaoVal) {
  var opcoes = SUBFUNCOES[funcaoVal];
  if (!opcoes) return '';
  return '<select id="' + prefix + '-subfuncao-select">' +
    '<option value=""' + (!subfuncaoVal ? ' selected' : '') + '>Nenhuma (genérico)</option>' +
    opcoes.map(function (s) { return '<option value="' + esc(s) + '"' + (subfuncaoVal === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
    '</select>';
}

function renderLocalCampos(prefix, funcaoVal, escolaVal, secaoVal) {
  var tipo = localTipoDaFuncao(funcaoVal);
  var html = '';
  if (tipo === 'escola' || tipo === 'secao') {
    html += '<select id="' + prefix + '-escola-select">' +
      '<option value=""' + (!escolaVal ? ' selected' : '') + ' disabled>Selecione a escola…</option>' +
      ESCOLAS_TRE.map(function (p) {
        return '<optgroup label="' + esc(p.ponto) + '">' +
          p.escolas.map(function (nome) { return '<option value="' + esc(nome) + '"' + (escolaVal === nome ? ' selected' : '') + '>' + esc(nome) + '</option>'; }).join('') +
          '</optgroup>';
      }).join('') +
      '</select>';
  }
  if (tipo === 'secao') {
    var secoesDaEscola = state.allGroups.filter(function (g) { return g.tipo === 'secao' && g.escola_id === (escolaIdPorNome(escolaVal) || '__nenhuma__'); })
      .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true }); });
    if (!escolaVal) {
      html += '<div class="hint" style="margin:0 2px 8px;">Selecione a escola pra ver as seções dela.</div>';
    } else if (!secoesDaEscola.length) {
      html += '<div class="hint" style="margin:0 2px 8px; color:#A24B3E;">Nenhuma seção cadastrada pra essa escola ainda.</div>';
    } else {
      html += '<select id="' + prefix + '-secao-select">' +
        '<option value=""' + (!secaoVal ? ' selected' : '') + ' disabled>Selecione a seção…</option>' +
        secoesDaEscola.map(function (g) {
          var numero = numeroDoSlugSecao(g.slug);
          return '<option value="' + esc(numero) + '"' + (secaoVal === numero ? ' selected' : '') + '>' + esc(g.nome) + '</option>';
        }).join('') +
        '</select>';
    }
  }
  return html;
}
function escolaIdPorNome(nome) {
  var g = state.allGroups.find(function (x) { return x.tipo === 'escola' && x.nome === nome; });
  return g ? g.id : null;
}

// Guarda a posição de rolagem de cada tela — voltar de uma conversa jogava
// sempre pro topo da lista de grupos (com dezenas de escolas, "sobe pro
// Geral" de novo, obrigando a rolar tudo e reabrir a pasta certa toda vez).
// Só salva/restaura quando a tela MUDA de verdade — não mexe na rolagem
// enquanto continua na mesma tela.
var scrollPorTela = {};
var telaRenderizadaAnterior = null;

function render() {
  var focus = null;
  var ae = document.activeElement;
  if (ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) focus = { id: ae.id, start: ae.selectionStart, end: ae.selectionEnd };
  var app = document.getElementById('app');
  var scrollAtual = window.scrollY || document.documentElement.scrollTop || 0;
  var trocouDeTela = state.screen !== telaRenderizadaAnterior;
  if (trocouDeTela && telaRenderizadaAnterior) scrollPorTela[telaRenderizadaAnterior] = scrollAtual;
  var html;
  if (state.screen === 'loading') html = renderLoading();
  else if (state.screen === 'login') html = renderLogin();
  else {
    var body = '';
    if (state.screen === 'mural') body = renderMural();
    else if (state.screen === 'grupos') body = renderGrupos();
    else if (state.screen === 'thread') body = renderThread();
    else if (state.screen === 'faq') body = renderFaq();
    else if (state.screen === 'perfil') body = renderPerfil();
    else if (state.screen === 'painel') body = renderPainel();
    html = renderHeader() + '<div class="scroll">' + (state.banner ? '<div class="banner-error">' + esc(state.banner) + '</div>' : '') + body + '</div>';
    if (state.screen === 'thread') html += renderThreadComposer();
    html += renderBottomNav();
  }
  app.innerHTML = html;
  if (focus) {
    var el = document.getElementById(focus.id);
    if (el) { el.focus(); if (el.setSelectionRange && (el.type === 'text' || el.type === 'email' || !el.type)) { try { el.setSelectionRange(focus.start, focus.end); } catch (e) {} } }
  }
  if (trocouDeTela) {
    var alvo = scrollPorTela[state.screen] || 0;
    if (alvo) window.scrollTo(0, alvo);
    telaRenderizadaAnterior = state.screen;
  }
}

function go(screen) {
  if (screen !== 'thread') leaveThread();
  state.screen = screen; state.banner = '';
  if (screen === 'painel') loadPainel();
  else if (screen === 'faq' && !state.faqLoaded) loadFaq();
  render();
}

  var id = e.target.id;
  var passoIdx = e.target.getAttribute && e.target.getAttribute('data-passo-idx');
  if (passoIdx !== null && passoIdx !== undefined) {
    var campo = e.target.getAttribute('data-passo-campo');
    if (state.muralFormPassos[passoIdx]) state.muralFormPassos[passoIdx][campo] = e.target.value;
    return;
  }
  if (id === 'login-nome-input') { state.loginNome = maskNome(e.target.value); aplicarMascara(e.target, state.loginNome); }
  else if (id === 'login-cpf-input') { state.loginCpf = maskCPF(e.target.value); aplicarMascara(e.target, state.loginCpf); }
  else if (id === 'login-titulo-input') { state.loginTitulo = maskTitulo(e.target.value); aplicarMascara(e.target, state.loginTitulo); }
  else if (id === 'login-nascimento-input') { state.loginNascimento = maskData(e.target.value); aplicarMascara(e.target, state.loginNascimento); }
  else if (id === 'faq-search-input') { state.faqSearch = e.target.value; state.activeFaqCat = null; render(); }
  else if (id === 'faq-categoria-nova-input') state.faqFormCategoriaNova = e.target.value;
  else if (id === 'faq-pergunta-input') state.faqFormPergunta = e.target.value;
  else if (id === 'faq-resposta-input') state.faqFormResposta = e.target.value;
  else if (id === 'compose-input') { state.composeText = e.target.value; if (state.composeCooldownOk) { state.composeCooldownOk = false; render(); } }
  else if (id === 'mural-titulo-input') state.muralFormTitulo = e.target.value;
  else if (id === 'mural-texto-input') state.muralFormTexto = e.target.value;
  else if (id === 'mural-topicos-titulo-input') state.muralFormTopicosTitulo = e.target.value;
  else if (id === 'new-email-input') state.newEmail = e.target.value;
  else if (id === 'new-name-input') state.newName = e.target.value;
  else if (id === 'new-cpf-input') { state.newCpf = maskCPF(e.target.value); aplicarMascara(e.target, state.newCpf); }
  else if (id === 'new-titulo-input') { state.newTitulo = maskTitulo(e.target.value); aplicarMascara(e.target, state.newTitulo); }
  else if (id === 'new-nascimento-input') { state.newNascimento = maskData(e.target.value); aplicarMascara(e.target, state.newNascimento); }
  else if (id === 'edit-nome-input') state.editNome = e.target.value;
  else if (id === 'painel-busca-input') { state.painelBusca = e.target.value; render(); }
  else if (id === 'config-geral-intervalo-input') { state.configGeralIntervaloForm = e.target.value; state.configGeralSalvo = false; }
  else if (id === 'nome-exibicao-input') { state.perfilFormNomeExibicao = e.target.value; state.perfilNomeSalvo = false; }
  else if (id === 'chave-pix-input') { state.perfilFormChavePix = e.target.value; state.perfilChavePixSalvo = false; }
  else if (id === 'verif-codigo-input') state.verifCodigo = e.target.value;
  else if (id === 'informe-texto-input') state.informeFormTexto = e.target.value;
});
document.addEventListener('focusin', function (e) {
  // teclado abrindo empurra o layout — sem isso, a conversa podia ficar
  // "presa" mostrando área em branco em vez das últimas mensagens, bem
  // onde a pessoa ia digitar. 'focusin' (não 'focus') porque precisa
  // borbulhar — o elemento é recriado a cada render(), não dá pra escutar
  // direto nele. Essa chamada aqui é só uma tentativa cedo — o teclado no
  // Android ainda nem começou a abrir nesse instante, por isso tem o
  // listener de visualViewport (mais embaixo) como o mecanismo de verdade.
  if (e.target && e.target.id === 'compose-input') rolarThreadParaBaixo();
});
// O visualViewport muda de tamanho quando o teclado termina de abrir/fechar
// de verdade (diferente do 'focusin', que dispara antes do teclado sequer
// começar a animar) — é o sinal confiável pra saber a hora certa de rolar.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    if (state.screen === 'thread' && document.activeElement && document.activeElement.id === 'compose-input') rolarThreadParaBaixo();
  });
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'compose-input') sendMessage();
  else if (e.target.id === 'login-nascimento-input') solicitarCodigo();
  else if (e.target.id === 'verif-codigo-input') confirmarVerificacaoEmail();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'new-funcao-select') { state.newFuncao = e.target.value; state.newSubfuncao = ''; state.newEscola = ''; state.newSecao = ''; render(); }
  else if (e.target.id === 'edit-funcao-select') { state.editFuncao = e.target.value; state.editSubfuncao = ''; state.editEscola = ''; state.editSecao = ''; render(); }
  else if (e.target.id === 'new-subfuncao-select') state.newSubfuncao = e.target.value;
  else if (e.target.id === 'edit-subfuncao-select') state.editSubfuncao = e.target.value;
  else if (e.target.id === 'new-escola-select') { state.newEscola = e.target.value; state.newSecao = ''; render(); }
  else if (e.target.id === 'edit-escola-select') { state.editEscola = e.target.value; state.editSecao = ''; render(); }
  else if (e.target.id === 'new-secao-select') state.newSecao = e.target.value;
  else if (e.target.id === 'edit-secao-select') state.editSecao = e.target.value;
  else if (e.target.id === 'import-file-input') { if (e.target.files && e.target.files[0]) processarArquivoImport(e.target.files[0]); }
  else if (e.target.id === 'login-aceite-checkbox') { state.loginAceite = e.target.checked; render(); }
  else if (e.target.id === 'faq-categoria-select') state.faqFormCategoria = e.target.value;
});
// Bloqueia só o "puxar pra baixo" quando já está no topo da tela (é isso que
// o navegador interpreta como pull-to-refresh e recarrega o app, voltando
// pro Mural mesmo se a pessoa estava navegando em outro lugar) — CSS sozinho
// (overscroll-behavior/touch-action) não deu conta disso de forma confiável
// no Android. Só intercepta esse gesto específico; rolar normalmente (pra
// cima, pra baixo fora do topo) continua igual.
(function () {
  var yInicial = 0;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) yInicial = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 1) return;
    var yAtual = e.touches[0].clientY;
    var rolagem = window.scrollY || document.documentElement.scrollTop || 0;
    if (rolagem <= 0 && yAtual > yInicial) e.preventDefault();
  }, { passive: false });
})();

window.addEventListener('online', function () { state.online = true; render(); flushOutbox(); });
window.addEventListener('offline', function () { state.online = false; render(); });

boot();

// Pede storage persistente — sem isso, o navegador (principalmente Android
// com pouco espaço) pode apagar o cache local do app sozinho por baixo dos
// panos quando precisar liberar espaço, mesmo o app sendo usado com
// frequência. Não garante 100% (o navegador pode negar), mas reduz muito a
// chance disso acontecer.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(function () {});
}

// Avisa quando tem versão nova publicada — sem isso, uma aba/PWA já aberta
// nunca reexecuta o JS novo sozinha só porque o arquivo mudou no servidor
// (o service worker por si só não resolve isso, só afeta a PRÓXIMA vez que
// a página carrega do zero). Com o ritmo de publicações desse projeto,
// rodar código velho já causou bug fantasma mais de uma vez.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update(); // confere na hora, não espera o navegador decidir sozinho quando checar
      setInterval(function () { reg.update(); }, 5 * 60 * 1000);
      reg.addEventListener('updatefound', function () {
        var novoWorker = reg.installing;
        if (!novoWorker) return;
        novoWorker.addEventListener('statechange', function () {
          // só avisa se JÁ tinha um service worker controlando antes — a
          // primeira instalação (app novo) não é "atualização", é normal
          if (novoWorker.state === 'installed' && navigator.serviceWorker.controller) {
            var banner = document.getElementById('update-banner');
            if (banner) banner.style.display = 'block';
          }
        });
      });
    }).catch(function () {});
  });
  var updateBanner = document.getElementById('update-banner');
  if (updateBanner) updateBanner.addEventListener('click', function () { window.location.reload(); });
}
</script>
</body>
</html>
